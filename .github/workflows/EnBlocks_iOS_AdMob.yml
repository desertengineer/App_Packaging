name: EnBlocks - iOS App Store (AdMob SDK) Release

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: "Build notes / TestFlight release description"
        required: false
        default: "Manual TestFlight build"
        type: string

permissions:
  contents: read

concurrency:
  group: enblocks-ios-release
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build and upload EnBlocks iOS app
    runs-on: macos-26
    environment: MagicBlockBlitz-Environment
    timeout-minutes: 60

    env:
      NODE_VERSION: "24"
      IOS_DEPLOYMENT_TARGET: "15.0"
      APP_VERSION: "1.1.2"
      BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER }}
      APP_NAME: ${{ vars.APP_NAME }}
      XCODE_SCHEME: ${{ vars.XCODE_SCHEME }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_APP_OPEN_AD_ID: ${{ secrets.ADMOB_APP_OPEN_AD_ID }}
      ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      ADMOB_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
      ADMOB_NATIVE_ADVANCED_AD_ID: ${{ secrets.ADMOB_NATIVE_ADVANCED_AD_ID }}
      ADMOB_REWARDED_AD_ID: ${{ secrets.ADMOB_REWARDED_AD_ID }}
      ADMOB_REWARDED_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_REWARDED_INTERSTITIAL_AD_ID }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASS }}
      KEYCHAIN_PASSWORD: temporary-${{ github.run_id }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      BASE64_PROVISIONING_PROFILE: ${{ secrets.BASE64_PROVISIONING_PROFILE }}
      APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
      MIN_IOS_SDK: 26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode 26 and verify iOS SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          selected=""
          for app in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            [[ -d "$app/Contents/Developer" ]] || continue

            sdk_path="$app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs"
            [[ -d "$sdk_path" ]] || continue

            if compgen -G "$sdk_path/iPhoneOS26*.sdk" > /dev/null; then
              selected="$app/Contents/Developer"
              break
            fi
          done

          if [[ -z "$selected" ]]; then
            echo "::error::No Xcode installation with the iOS 26 SDK was found."
            echo "Installed Xcode apps:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          sudo xcode-select -s "$selected"

          echo "Selected developer directory: $(xcode-select -p)"
          xcodebuild -version

          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Selected iOS SDK: $sdk_version"

          sdk_major="${sdk_version%%.*}"
          if [[ "$sdk_major" -lt 26 ]]; then
            echo "::error::App Store Connect requires the iOS 26 SDK or newer; found $sdk_version."
            exit 1
          fi

      - name: Install iOS platform for Xcode
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Selected Xcode:"
          xcodebuild -version

          echo "Downloading iOS platform components..."
          xcodebuild -downloadPlatform iOS

          echo "Installed iOS SDKs:"
          xcodebuild -showsdks

          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Active iOS SDK version: $sdk_version"

          sdk_major="${sdk_version%%.*}"
          if [[ "$sdk_major" -lt 26 ]]; then
            echo "::error::The selected Xcode does not have the required iOS 26 SDK. Found: $sdk_version"
            exit 1
          fi

      - name: Verify Xcode SDK version
        shell: bash
        run: |
          set -Eeuo pipefail

          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Detected iOS SDK version: $sdk_version"

          sdk_major="${sdk_version%%.*}"
          if [[ "$sdk_major" -lt "$MIN_IOS_SDK" ]]; then
            echo "::error::App Store Connect requires iOS SDK $MIN_IOS_SDK or newer. Detected: $sdk_version"
            exit 1
          fi

          echo "iOS SDK version $sdk_version meets the minimum requirement"

      - name: Locate EnBlocks project
        shell: bash
        run: |
          set -Eeuo pipefail

          configured_dir="${{ vars.MONOREPO_DIRECTORY || 'EnBlocks' }}"
          configured_dir="${configured_dir%/}"

          if [[ -f "$configured_dir/package.json" ]]; then
            target_dir="$configured_dir"
          elif [[ -f "EnBlocks/package.json" ]]; then
            target_dir="EnBlocks"
          elif [[ -f "package.json" && -d "ios/App" ]]; then
            target_dir="."
          else
            echo "::error::Could not locate EnBlocks."
            exit 1
          fi

          target_dir="$(cd "$target_dir" && pwd)"
          echo "TARGET_DIR=$target_dir" >> "$GITHUB_ENV"

      - name: Validate configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${BUNDLE_ID:?Missing BUNDLE_ID}"
          : "${XCODE_SCHEME:?Missing XCODE_SCHEME}"
          : "${ADMOB_APP_ID:?Missing ADMOB_APP_ID}"
          : "${ADMOB_BANNER_AD_ID:?Missing ADMOB_BANNER_AD_ID}"
          : "${ADMOB_INTERSTITIAL_AD_ID:?Missing ADMOB_INTERSTITIAL_AD_ID}"
          : "${ADMOB_REWARDED_AD_ID:?Missing ADMOB_REWARDED_AD_ID}"

      - name: Validate project structure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$TARGET_DIR"

          required_paths=(
            "package.json"
            "package-lock.json"
            "capacitor.config.json"
            "www/index.html"
            "www/index.js"
            "ios/App/App.xcworkspace"
            "ios/App/App.xcodeproj"
            "ios/App/Podfile"
            "ios/App/App/Info.plist"
            "ios/App/GoogleMobileAds.xcframework"
            "ios/App/UserMessagingPlatform.xcframework"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Missing required path: $TARGET_DIR/$path"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TARGET_DIR }}/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt of 3"

            if npm ci --no-audit --no-fund --progress=false; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency installation failed; retrying in 20 seconds."
              sleep 20
            fi
          done

          echo "::error::npm ci failed after 3 attempts."
          exit 1

      - name: Patch AdMob consent code for current UMP Swift API
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          consent_file="node_modules/@capacitor-community/admob/ios/Plugin/Consent/ConsentExecutor.swift"
          test -f "$consent_file"

          cat > "$consent_file" <<'SWIFT'
          import Foundation
          import Capacitor
          import GoogleMobileAds
          import UserMessagingPlatform

          class ConsentExecutor: NSObject {
              public weak var plugin: AdMob?

              func requestConsentInfo(
                  _ call: CAPPluginCall,
                  _ debugGeography: Int,
                  _ testDeviceIdentifiers: [String],
                  _ tagForUnderAgeOfConsent: Bool
              ) {
                  Task { @MainActor in
                      let parameters = RequestParameters()
                      let debugSettings = DebugSettings()

                      debugSettings.geography =
                          DebugGeography(rawValue: debugGeography) ?? .disabled
                      debugSettings.testDeviceIdentifiers = testDeviceIdentifiers

                      parameters.debugSettings = debugSettings
                      parameters.isTaggedForUnderAgeOfConsent = tagForUnderAgeOfConsent

                      do {
                          try await ConsentInformation.shared
                              .requestConsentInfoUpdate(with: parameters)

                          let information = ConsentInformation.shared
                          call.resolve([
                              "status": self.getConsentStatusString(information.consentStatus),
                              "isConsentFormAvailable":
                                  information.formStatus == FormStatus.available
                          ])
                      } catch {
                          call.reject("Request consent info failed: \(error.localizedDescription)")
                      }
                  }
              }

              func showConsentForm(_ call: CAPPluginCall) {
                  Task { @MainActor in
                      guard let rootViewController = self.plugin?.getRootVC() else {
                          call.reject("No ViewController")
                          return
                      }

                      let information = ConsentInformation.shared

                      guard information.formStatus == FormStatus.available else {
                          call.reject("Consent Form not available")
                          return
                      }

                      do {
                          if information.consentStatus == ConsentStatus.required {
                              let form = try await ConsentForm.load()
                              try await form.present(from: rootViewController)
                          }

                          call.resolve([
                              "status": self.getConsentStatusString(
                                  ConsentInformation.shared.consentStatus
                              )
                          ])
                      } catch {
                          call.reject("Consent form failed: \(error.localizedDescription)")
                      }
                  }
              }

              func resetConsentInfo(_ call: CAPPluginCall) {
                  ConsentInformation.shared.reset()
                  call.resolve([:])
              }

              func getConsentStatusString(_ consentStatus: ConsentStatus) -> String {
                  switch consentStatus {
                  case .required:
                      return "REQUIRED"
                  case .notRequired:
                      return "NOT_REQUIRED"
                  case .obtained:
                      return "OBTAINED"
                  default:
                      return "UNKNOWN"
                  }
              }
          }
          SWIFT

          echo "Patched AdMob ConsentExecutor.swift for current UMP Swift API"

      - name: Configure Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("capacitor.config.json")

          with path.open("r", encoding="utf-8") as file:
              config = json.load(file)

          config["appId"] = os.environ["BUNDLE_ID"]
          config["appName"] = os.environ["APP_NAME"]
          config["webDir"] = "www"

          plugins = config.setdefault("plugins", {})
          admob = plugins.setdefault("AdMob", {})
          admob["appId"] = os.environ["ADMOB_APP_ID"]

          with path.open("w", encoding="utf-8") as file:
              json.dump(config, file, indent=2)
              file.write("\n")
          PY

      - name: Generate AdMob runtime configuration
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "appId": os.environ["ADMOB_APP_ID"],
              "appOpen": os.environ["ADMOB_APP_OPEN_AD_ID"],
              "banner": os.environ["ADMOB_BANNER_AD_ID"],
              "interstitial": os.environ["ADMOB_INTERSTITIAL_AD_ID"],
              "nativeAdvanced": os.environ["ADMOB_NATIVE_ADVANCED_AD_ID"],
              "rewarded": os.environ["ADMOB_REWARDED_AD_ID"],
              "rewardedInterstitial": os.environ["ADMOB_REWARDED_INTERSTITIAL_AD_ID"]
          }

          content = (
              "/* Generated by GitHub Actions. Do not edit manually. */\n"
              "window.__ADMOB_CONFIG__ = Object.freeze("
              + json.dumps(config, indent=4)
              + ");\n"
          )

          Path("www/admob-config.js").write_text(content, encoding="utf-8")
          PY

          test -s www/admob-config.js

      - name: Sync Capacitor iOS
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          set -Eeuo pipefail
          npx cap sync ios

      - name: Configure Info.plist
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          plist="ios/App/App/Info.plist"

          set_value() {
            local key="$1"
            local type="$2"
            local value="$3"

            /usr/libexec/PlistBuddy \
              -c "Set :$key $value" \
              "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy \
              -c "Add :$key $type $value" \
              "$plist"
          }

          set_value GADApplicationIdentifier string "$ADMOB_APP_ID"
          set_value NSUserTrackingUsageDescription string "This identifier will be used to deliver personalized ads to you."
          set_value UIRequiresFullScreen bool true
          set_value ITSAppUsesNonExemptEncryption bool false

      - name: Create PrivacyInfo.xcprivacy for AdMob
        working-directory: ${{ env.TARGET_DIR }}/ios/App/App
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > PrivacyInfo.xcprivacy <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSPrivacyCollectedDataTypes</key>
              <array>
                  <dict>
                      <key>NSPrivacyCollectedDataType</key>
                      <string>NSPrivacyCollectedDataTypeIdentifier</string>
                      <key>NSPrivacyCollectedDataTypeLinked</key>
                      <true/>
                      <key>NSPrivacyCollectedDataTypeTracking</key>
                      <true/>
                      <key>NSPrivacyCollectedDataTypePurposes</key>
                      <array>
                          <string>NSPrivacyCollectedDataTypePurposeAdvertising</string>
                      </array>
                  </dict>
                  <dict>
                      <key>NSPrivacyCollectedDataType</key>
                      <string>NSPrivacyCollectedDataTypeCoarseLocation</string>
                      <key>NSPrivacyCollectedDataTypeLinked</key>
                      <false/>
                      <key>NSPrivacyCollectedDataTypeTracking</key>
                      <false/>
                      <key>NSPrivacyCollectedDataTypePurposes</key>
                      <array>
                          <string>NSPrivacyCollectedDataTypePurposeAdvertising</string>
                      </array>
                  </dict>
                  <dict>
                      <key>NSPrivacyCollectedDataType</key>
                      <string>NSPrivacyCollectedDataTypeUsageData</string>
                      <key>NSPrivacyCollectedDataTypeLinked</key>
                      <false/>
                      <key>NSPrivacyCollectedDataTypeTracking</key>
                      <false/>
                      <key>NSPrivacyCollectedDataTypePurposes</key>
                      <array>
                          <string>NSPrivacyCollectedDataTypePurposeAdvertising</string>
                          <string>NSPrivacyCollectedDataTypePurposeAnalytics</string>
                      </array>
                  </dict>
                  <dict>
                      <key>NSPrivacyCollectedDataType</key>
                      <string>NSPrivacyCollectedDataTypeDiagnostics</string>
                      <key>NSPrivacyCollectedDataTypeLinked</key>
                      <false/>
                      <key>NSPrivacyCollectedDataTypeTracking</key>
                      <false/>
                      <key>NSPrivacyCollectedDataTypePurposes</key>
                      <array>
                          <string>NSPrivacyCollectedDataTypePurposeAnalytics</string>
                      </array>
                  </dict>
              </array>

              <key>NSPrivacyTrackingDomains</key>
              <array>
                  <string>googleads.g.doubleclick.net</string>
                  <string>google.com</string>
                  <string>googlesyndication.com</string>
              </array>
          </dict>
          </plist>
          EOF

          echo "PrivacyInfo.xcprivacy created successfully"

      # ============================================
      # REFINED COCOAPODS INTEGRATION & FRAMEWORK HANDLING
      # ============================================

      - name: Update Podfile for Capacitor and AdMob
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > Podfile <<'EOF'
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '15.0'
          use_frameworks!

          install! 'cocoapods',
            :disable_input_output_paths => true

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCommunityAdmob', :path => '../../node_modules/@capacitor-community/admob'
            pod 'CapacitorPluginAppTrackingTransparency', :path => '../../node_modules/capacitor-plugin-app-tracking-transparency'
          end

          target 'App' do
            capacitor_pods

            post_install do |installer|
              assertDeploymentTarget(installer)

              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['SWIFT_VERSION'] = '5.0'
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['DEVELOPMENT_TEAM'] = ''
                  config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                  config.build_settings['PROVISIONING_PROFILE'] = ''
                end
              end
            end
          end
          EOF

          echo "Podfile updated successfully"

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          set -Eeuo pipefail
          rm -rf Pods/ || true
          rm -f Podfile.lock || true
          pod repo update
          pod install
          test -d Pods/Pods.xcodeproj
          test -f Podfile.lock

      - name: Install xcodeproj Ruby gem
        shell: bash
        run: |
          set -Eeuo pipefail
          gem install xcodeproj --no-document

      - name: Configure build settings for Google Mobile Ads SDK
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          app_target = project.targets.find { |t| t.name == 'App' }
          abort 'App target not found' unless app_target

          app_target.build_configurations.each do |config|
            settings = config.build_settings

            current_runpath = Array(settings['LD_RUNPATH_SEARCH_PATHS'])
            unless current_runpath.include?('/usr/lib/swift')
              settings['LD_RUNPATH_SEARCH_PATHS'] = current_runpath + ['$(inherited)', '/usr/lib/swift']
            end

            current_flags = Array(settings['OTHER_LDFLAGS'])
            unless current_flags.include?('-ObjC')
              settings['OTHER_LDFLAGS'] = current_flags + ['$(inherited)', '-ObjC']
            end

            settings['SWIFT_VERSION'] = '5.0'
          end

          project.save
          puts 'Configured build settings for Google Mobile Ads SDK'
          RUBY

      - name: Disable signing for every CocoaPods target
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail

          ruby <<'RUBY'
          require 'xcodeproj'
          pods_project_path = 'Pods/Pods.xcodeproj'
          project = Xcodeproj::Project.open(pods_project_path)

          project.targets.each do |target|
            target.build_configurations.each do |configuration|
              settings = configuration.build_settings
              settings['CODE_SIGNING_ALLOWED'] = 'NO'
              settings['CODE_SIGNING_REQUIRED'] = 'NO'
              settings['CODE_SIGN_IDENTITY'] = '-'
              settings['DEVELOPMENT_TEAM'] = ''
              settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              settings['PROVISIONING_PROFILE'] = ''
            end
          end

          project.save
          puts 'Disabled signing for all CocoaPods targets.'
          RUBY

      # ============================================
      # APPLE SIGNING CONFIGURATION
      # ============================================

      - name: Validate signing secrets
        shell: bash
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -Eeuo pipefail

          : "${APPLE_CERTIFICATE_P12:?Missing APPLE_CERTIFICATE_P12}"
          : "${APPLE_CERTIFICATE_PASS:?Missing APPLE_CERTIFICATE_PASS}"
          : "${PROVISIONING_PROFILE_BASE64:?Missing BASE64_PROVISIONING_PROFILE}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing APP_STORE_CONNECT_KEY_ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID}"
          : "${ASC_KEY_CONTENT:?Missing APP_STORE_CONNECT_KEY_CONTENT}"

      - name: Import Apple distribution certificates
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: "temporary-${{ github.run_id }}"
        run: |
          set -Eeuo pipefail

          certificate_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASS" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -s "$keychain_path"

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Install App Store provisioning profile
        shell: bash
        env:
          BASE64_PROVISIONING_PROFILE: ${{ secrets.BASE64_PROVISIONING_PROFILE }}
        run: |
          set -Eeuo pipefail

          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"

          mkdir -p "$profile_dir"

          echo "$BASE64_PROVISIONING_PROFILE" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$profile_plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$profile_plist")
          provisioned_devices=$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$profile_plist" 2>/dev/null || true)

          echo "Provisioning profile: $profile_name"
          echo "Profile application identifier: $profile_app_id"

          if [[ "$profile_app_id" != *"$BUNDLE_ID" ]]; then
            echo "::error::Provisioning profile does not match $BUNDLE_ID"
            exit 1
          fi

          if [[ -n "$provisioned_devices" ]]; then
            echo "::error::The profile is not an App Store distribution profile."
            exit 1
          fi

          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

      - name: Configure native App target signing
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        env:
          APP_PROFILE_UUID: ${{ env.PROFILE_UUID }}
          APP_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          set -Eeuo pipefail
          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('App.xcodeproj')
          target = project.targets.find { |item| item.name == 'App' }
          abort 'Native App target was not found.' unless target

          target.build_configurations.each do |configuration|
            settings = configuration.build_settings
            settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('APP_BUNDLE_ID')
            settings['DEVELOPMENT_TEAM'] = ENV.fetch('APP_TEAM_ID')
            settings['CODE_SIGN_STYLE'] = 'Manual'
            settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('APP_PROFILE_UUID')
            settings['CODE_SIGNING_ALLOWED'] = 'YES'
            settings['CODE_SIGNING_REQUIRED'] = 'YES'
          end
          project.save
          puts 'Configured manual signing on the native App target.'
          RUBY

      - name: Set iOS version and build number
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail
          plist="App/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$plist"

      - name: Fix AdMob SDK initialization in AppDelegate
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/App/App/AppDelegate.swift")
          source = path.read_text(encoding="utf-8")

          old = "MobileAds.shared.start()"
          new = "GADMobileAds.sharedInstance().start(completionHandler: nil)"

          if old not in source:
              raise SystemExit(
                  f"Expected initialization call was not found in {path}. "
                  "Check the current AppDelegate.swift before applying this patch."
              )

          path.write_text(source.replace(old, new), encoding="utf-8")
          print(f"Updated AdMob initialization in {path}")
          PY
      # ============================================
      # BUILD & ARCHIVE
      # ============================================

      - name: Archive iOS app
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail

          archive_path="$RUNNER_TEMP/EnBlocks.xcarchive"
          log_path="$RUNNER_TEMP/xcodebuild.log"

          set +e

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            SDKROOT=iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$log_path"

          build_status=${PIPESTATUS[0]}
          set -e

          if [[ "$build_status" -ne 0 ]]; then
            echo "===== XCODE / SWIFT ERRORS ====="
            grep -n -C 5 -E '(^|[[:space:]])error:|fatal error:' "$log_path" || true

            echo "===== LAST 300 BUILD LOG LINES ====="
            tail -n 300 "$log_path"
            exit "$build_status"
          fi

          test -d "$archive_path/Products/Applications/App.app"

      - name: Upload Xcode archive log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Xcode-archive-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Create export options
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              "method": "app-store-connect",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "destination": "export",
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_UUID"]
              }
          }

          with Path("exportOptions.plist").open("wb") as file:
              plistlib.dump(options, file)
          PY

          plutil -lint exportOptions.plist

      - name: Export IPA
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          archive_path="$RUNNER_TEMP/EnBlocks.xcarchive"
          output_path="$TARGET_DIR/ios/App/output"

          rm -rf "$output_path"
          mkdir -p "$output_path"

          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$output_path"

          ipa_path="$(find "$output_path" -maxdepth 1 -name "*.ipa" -print -quit)"

          if [[ -z "$ipa_path" || ! -f "$ipa_path" ]]; then
            echo "::error::No IPA was produced."
            exit 1
          fi

          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Validate signed app
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          app_path="$RUNNER_TEMP/EnBlocks.xcarchive/Products/Applications/App.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          actual_bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app_path/Info.plist")
          if [[ "$actual_bundle_id" != "$BUNDLE_ID" ]]; then
            echo "::error::Bundle ID mismatch."
            exit 1
          fi

          archive_admob_id=$(/usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$app_path/Info.plist")
          if [[ "$archive_admob_id" != "$ADMOB_APP_ID" ]]; then
            echo "::error::AdMob application ID mismatch."
            exit 1
          fi

          skad_count=$(/usr/libexec/PlistBuddy -c "Print :SKAdNetworkItems" "$app_path/Info.plist" 2>/dev/null | grep -c "SKAdNetworkIdentifier" || echo "0")
          if [[ "$skad_count" -lt "10" ]]; then
            echo "::error::SKAdNetworkItems not properly configured in built app."
            exit 1
          fi
          echo "SKAdNetworkItems verified: $skad_count identifiers found"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: EnBlocks-iOS-${{ github.run_number }}
          path: ${{ env.TARGET_DIR }}/ios/App/output/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -Eeuo pipefail

          : "${ASC_KEY_CONTENT:?Missing APP_STORE_CONNECT_KEY_CONTENT}"

          api_key_dir="$HOME/.appstoreconnect/private_keys"
          key_file="$api_key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          mkdir -p "$api_key_dir"

          if [[ "$ASC_KEY_CONTENT" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY_CONTENT" > "$key_file"
          else
            echo "$ASC_KEY_CONTENT" | base64 --decode > "$key_file"
          fi

          chmod 600 "$key_file"

          xcrun altool \
            --upload-app \
            -t ios \
            -f "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"