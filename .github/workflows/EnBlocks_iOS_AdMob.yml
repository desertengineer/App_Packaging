name: EnBlocks - iOS App Store

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: "Build notes / TestFlight release description"
        required: false
        default: "Manual TestFlight build"
        type: string

permissions:
  contents: read

concurrency:
  group: enblocks-ios-release
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build and upload EnBlocks iOS app
    runs-on: macos-15
    environment: MagicBlockBlitz-Environment
    timeout-minutes: 60

    env:
      NODE_VERSION: "22"
      IOS_DEPLOYMENT_TARGET: "15.0"
      APP_VERSION: "1.0.4"

      BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}
      APP_NAME: ${{ vars.APP_NAME || 'Magic Block Blitz 2026' }}
      XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}

      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_APP_OPEN_AD_ID: ${{ secrets.ADMOB_APP_OPEN_AD_ID }}
      ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      ADMOB_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
      ADMOB_NATIVE_ADVANCED_AD_ID: ${{ secrets.ADMOB_NATIVE_ADVANCED_AD_ID }}
      ADMOB_REWARDED_AD_ID: ${{ secrets.ADMOB_REWARDED_AD_ID }}
      ADMOB_REWARDED_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_REWARDED_INTERSTITIAL_AD_ID }}

      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate EnBlocks project
        shell: bash
        run: |
          set -Eeuo pipefail

          configured_dir="${{ vars.MONOREPO_DIRECTORY || 'EnBlocks' }}"
          configured_dir="${configured_dir%/}"

          if [[ -f "$configured_dir/package.json" ]]; then
            target_dir="$configured_dir"
          elif [[ -f "EnBlocks/package.json" ]]; then
            target_dir="EnBlocks"
          elif [[ -f "package.json" && -d "ios/App" ]]; then
            target_dir="."
          else
            echo "::error::Could not locate EnBlocks."
            exit 1
          fi

          target_dir="$(cd "$target_dir" && pwd)"
          echo "TARGET_DIR=$target_dir" >> "$GITHUB_ENV"

      - name: Validate configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${BUNDLE_ID:?Missing BUNDLE_ID}"
          : "${XCODE_SCHEME:?Missing XCODE_SCHEME}"
          : "${ADMOB_APP_ID:?Missing ADMOB_APP_ID}"
          : "${ADMOB_BANNER_AD_ID:?Missing ADMOB_BANNER_AD_ID}"
          : "${ADMOB_INTERSTITIAL_AD_ID:?Missing ADMOB_INTERSTITIAL_AD_ID}"
          : "${ADMOB_REWARDED_AD_ID:?Missing ADMOB_REWARDED_AD_ID}"

      - name: Validate project structure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$TARGET_DIR"

          required_paths=(
            package.json
            package-lock.json
            capacitor.config.json
            www/index.html
            www/index.js
            ios/App/App.xcworkspace
            ios/App/App.xcodeproj
            ios/App/Podfile
            ios/App/App/Info.plist
          )

          for path in "${required_paths[@]}"; do
            [[ -e "$path" ]] || {
              echo "::error::Missing $path"
              exit 1
            }
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TARGET_DIR }}/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund --progress=false

      - name: Verify pinned dependencies
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const pkg = require("./package.json");
          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          for (const name of [
            "@capacitor/core",
            "@capacitor/cli",
            "@capacitor/ios",
            "@capacitor-community/admob"
          ]) {
            const version = deps[name];

            if (!version) {
              throw new Error(`Missing dependency: ${name}`);
            }

            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`${name} must be pinned exactly: ${version}`);
            }

            console.log(`${name}: ${version}`);
          }
          NODE

      - name: Configure Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("capacitor.config.json")

          with path.open(encoding="utf-8") as file:
              config = json.load(file)

          config["appId"] = os.environ["BUNDLE_ID"]
          config["appName"] = os.environ["APP_NAME"]
          config["webDir"] = "www"

          config.setdefault("plugins", {}).setdefault("AdMob", {})["appId"] = os.environ["ADMOB_APP_ID"]

          with path.open("w", encoding="utf-8") as file:
              json.dump(config, file, indent=2)
              file.write("\n")
          PY

      - name: Generate AdMob runtime configuration
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              "appId": os.environ["ADMOB_APP_ID"],
              "appOpen": os.environ["ADMOB_APP_OPEN_AD_ID"],
              "banner": os.environ["ADMOB_BANNER_AD_ID"],
              "interstitial": os.environ["ADMOB_INTERSTITIAL_AD_ID"],
              "nativeAdvanced": os.environ["ADMOB_NATIVE_ADVANCED_AD_ID"],
              "rewarded": os.environ["ADMOB_REWARDED_AD_ID"],
              "rewardedInterstitial": os.environ["ADMOB_REWARDED_INTERSTITIAL_AD_ID"]
          }

          content = (
              "/* Generated by GitHub Actions. Do not edit manually. */\n"
              "window.__ADMOB_CONFIG__ = Object.freeze("
              + json.dumps(values, indent=4)
              + ");\n"
          )

          Path("www/admob-config.js").write_text(content, encoding="utf-8")
          PY

          test -s www/admob-config.js
          grep -q "window.__ADMOB_CONFIG__" www/admob-config.js

      - name: Verify HTML script order
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          config_line=$(grep -n 'admob-config.js' www/index.html | head -n 1 | cut -d: -f1 || true)
          app_line=$(grep -n 'index.js' www/index.html | tail -n 1 | cut -d: -f1 || true)

          [[ -n "$config_line" ]] || {
            echo "::error::www/index.html does not load admob-config.js"
            exit 1
          }

          [[ -n "$app_line" ]] || {
            echo "::error::www/index.html does not load index.js"
            exit 1
          }

          (( config_line < app_line )) || {
            echo "::error::admob-config.js must load before index.js"
            exit 1
          }

      - name: Validate JavaScript syntax
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check www/index.js

          count_safe=$(grep -c 'function safeAppInit' www/index.js || true)
          count_settings=$(grep -c 'function setupSettingsControls' www/index.js || true)

          [[ "$count_safe" == "1" ]] || {
            echo "::error::Expected exactly one safeAppInit function; found $count_safe"
            exit 1
          }

          [[ "$count_settings" == "1" ]] || {
            echo "::error::Expected exactly one setupSettingsControls function; found $count_settings"
            exit 1
          }

      - name: Sync Capacitor iOS
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          set -Eeuo pipefail
          npx cap sync ios

      - name: Configure Info.plist
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          plist="ios/App/App/Info.plist"

          set_value() {
            local key="$1"
            local type="$2"
            local value="$3"

            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :$key $type $value" "$plist"
          }

          set_value GADApplicationIdentifier string "$ADMOB_APP_ID"
          set_value NSUserTrackingUsageDescription string "This identifier will be used to deliver personalized ads to you."
          set_value UIRequiresFullScreen bool true
          set_value ITSAppUsesNonExemptEncryption bool false

      - name: Install CocoaPods
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          set -Eeuo pipefail
          pod install --deployment

      - name: Validate signing secrets
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -Eeuo pipefail

          : "${CERTIFICATE_BASE64:?Missing APPLE_CERTIFICATE_P12}"
          : "${CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASS}"
          : "${PROVISIONING_PROFILE_BASE64:?Missing BASE64_PROVISIONING_PROFILE}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing APP_STORE_CONNECT_KEY_ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID}"
          : "${ASC_KEY_CONTENT:?Missing APP_STORE_CONNECT_KEY_CONTENT}"

      - name: Import Apple certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: "temporary-${{ github.run_id }}"
        run: |
          set -Eeuo pipefail

          certificate="$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"

          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        shell: bash
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE }}
        run: |
          set -Eeuo pipefail

          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"

          mkdir -p "$profile_dir"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"

          security cms -D -i "$profile" > "$profile_plist"

          profile_uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$profile_plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$profile_plist")

          [[ "$profile_app_id" == *"$BUNDLE_ID" ]] || {
            echo "::error::Provisioning profile does not match $BUNDLE_ID"
            exit 1
          }

          cp "$profile" "$profile_dir/$profile_uuid.mobileprovision"
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
  
      - name: Configure App target signing
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          app_target = project.targets.find { |target| target.name == 'App' }

          abort 'Could not find native App target' unless app_target

          profile_uuid = ENV.fetch('PROFILE_UUID')
          team_id = ENV.fetch('APPLE_TEAM_ID')

          app_target.build_configurations.each do |configuration|
            settings = configuration.build_settings

            settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE_ID')
            settings['DEVELOPMENT_TEAM'] = team_id
            settings['CODE_SIGN_STYLE'] = 'Manual'
            settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            settings['PROVISIONING_PROFILE_SPECIFIER'] = profile_uuid
            settings['CODE_SIGNING_ALLOWED'] = 'YES'
            settings['CODE_SIGNING_REQUIRED'] = 'YES'
          end

          project.save
          puts 'Configured manual signing on the native App target only.'
          RUBY

          echo "Native App target signing settings:"
          grep -n \
            "CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY\|DEVELOPMENT_TEAM\|PROVISIONING_PROFILE_SPECIFIER" \
            App.xcodeproj/project.pbxproj
        env:
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}

      - name: Verify App target signing settings
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail

          settings_file="$RUNNER_TEMP/app-build-settings.txt"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -showBuildSettings \
            > "$settings_file"

          cat "$settings_file"

          require_setting() {
            local expected="$1"

            if ! grep -F -- "$expected" "$settings_file" > /dev/null; then
              echo "::error::Missing expected Xcode setting: $expected"
              exit 1
            fi
          }

          require_setting "TARGET_NAME = App"
          require_setting "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID"
          require_setting "CODE_SIGN_IDENTITY = Apple Distribution"
          require_setting "CODE_SIGN_STYLE = Manual"
          require_setting "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
          require_setting "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_UUID"

          echo "App target signing settings verified successfully."

      - name: Archive iOS app
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail

          archive_path="$RUNNER_TEMP/EnBlocks.xcarchive"
          log_path="$RUNNER_TEMP/xcodebuild.log"

          set +e

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$log_path"

          build_status=${PIPESTATUS[0]}
          set -e

          if [[ "$build_status" -ne 0 ]]; then
            echo "===== SWIFT/BUILD DIAGNOSTICS ====="
            grep -n -E \
              "error:|warning:|SwiftCompile|CapacitorCommunityAdmob|AdInterstitialExecutor|AdRewardExecutor|ConsentExecutor|Plugin.swift" \
              "$log_path" \
              | tail -n 200 || true

            echo "===== LAST 300 BUILD LOG LINES ====="
            tail -n 300 "$log_path"

            exit "$build_status"
          fi

          test -d "$archive_path/Products/Applications/App.app"

      - name: Create export options
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              "method": "app-store-connect",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "destination": "export",
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_UUID"]
              }
          }

          with Path("exportOptions.plist").open("wb") as file:
              plistlib.dump(options, file)
          PY

          plutil -lint exportOptions.plist

      - name: Export IPA
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          output_path="$TARGET_DIR/ios/App/output"
          rm -rf "$output_path"
          mkdir -p "$output_path"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/EnBlocks.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$output_path"

          ipa_path="$(find "$output_path" -maxdepth 1 -name '*.ipa' -print -quit)"

          [[ -f "$ipa_path" ]] || {
            echo "::error::No IPA was produced."
            exit 1
          }

          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Validate signed app
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          app_path="$RUNNER_TEMP/EnBlocks.xcarchive/Products/Applications/App.app"

          codesign --verify --deep --strict --verbose=2 "$app_path"

          actual_bundle_id=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$app_path/Info.plist"
          )

          [[ "$actual_bundle_id" == "$BUNDLE_ID" ]] || {
            echo "::error::Bundle ID mismatch: $actual_bundle_id"
            exit 1
          }

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnBlocks-iOS-${{ github.run_number }}
          path: ${{ env.TARGET_DIR }}/ios/App/output/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        working-directory: ${{ env.TARGET_DIR }}
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          api_key_dir="$HOME/.appstoreconnect/private_keys"
          key_file="$api_key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          mkdir -p "$api_key_dir"

          if [[ "$ASC_KEY_CONTENT" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY_CONTENT" > "$key_file"
          else
            echo "$ASC_KEY_CONTENT" | base64 --decode > "$key_file"
          fi

          chmod 600 "$key_file"

          xcrun altool \
            --upload-app \
            -t ios \
            -f "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
      
          - name: Verify AdMob pod Swift settings
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail

          settings="$RUNNER_TEMP/admob-pod-build-settings.txt"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -showBuildSettings \
            > "$settings"

          echo "Relevant build settings:"
          grep -E \
            "SWIFT_VERSION|SWIFT_STRICT_CONCURRENCY|IPHONEOS_DEPLOYMENT_TARGET|TARGET_NAME" \
            "$settings" || true