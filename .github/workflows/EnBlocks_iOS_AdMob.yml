name: EnBlocks iOS AdMob Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  NODE_VERSION: 22
  IOS_DEPLOYMENT_TARGET: "15.0"
  APP_NAME: "Magic Block Blitz 2026"
  BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
  CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
  PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp1234' }}

jobs:
  ios-build:
    runs-on: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set Capacitor app ID and app name from env
        shell: bash
        run: |
          set -Eeuo pipefail
          npx cap setAppId "$BUNDLE_ID"
          npx cap setAppName "$APP_NAME"

      - name: Sync Capacitor iOS project
        shell: bash
        run: |
          set -Eeuo pipefail
          npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        shell: bash
        run: |
          set -Eeuo pipefail
          pod install --repo-update

      - name: Import signing certificate and provisioning profile
        shell: bash
        run: |
          set -Eeuo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign

          mkdir -p "$PROFILE_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/App.mobileprovision"
          cp "$RUNNER_TEMP/App.mobileprovision" "$PROFILE_DIR/"

      - name: Verify App target signing
        working-directory: ios/App
        shell: bash
        run: |
          set -Eeuo pipefail
          xcodebuild -list -project App.xcodeproj -scheme App

      - name: Archive iOS app
        working-directory: ios/App
        shell: bash
        run: |
          set -Eeuo pipefail

          archive_path="$RUNNER_TEMP/EnBlocks.xcarchive"
          log_path="$RUNNER_TEMP/xcodebuild.log"

          set +e
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$log_path"

          build_status=${PIPESTATUS[0]}
          set -e

          if [[ "$build_status" -ne 0 ]]; then
            echo "===== BUILD DIAGNOSTICS ====="
            grep -n -E "error:|warning:|SwiftCompile|signing|profile|provision" "$log_path" | tail -n 250 || true
            echo "===== LAST 300 BUILD LOG LINES ====="
            tail -n 300 "$log_path"
            exit "$build_status"
          fi

          test -d "$archive_path/Products/Applications/App.app"

      - name: Upload generated CocoaPods lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EnBlocks-Podfile-lock-${{ github.run_number }}
          path: ios/App/Podfile.lock
          if-no-files-found: warn
          retention-days: 14