name: EnBlocks - iOS AdMob

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: "Build notes / TestFlight release description"
        required: false
        default: "Manual TestFlight build"
        type: string

permissions:
  contents: read

concurrency:
  group: enblocks-ios-release
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build and upload EnBlocks iOS app
    runs-on: macos-15
    environment: MagicBlockBlitz-Environment
    timeout-minutes: 60

    env:
      NODE_VERSION: "22"
      IOS_DEPLOYMENT_TARGET: "15.0"
      APP_VERSION: "1.0.4"

      BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}
      APP_NAME: ${{ vars.APP_NAME || 'Magic Block Blitz 2026' }}
      XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}

      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_APP_OPEN_AD_ID: ${{ secrets.ADMOB_APP_OPEN_AD_ID }}
      ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      ADMOB_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
      ADMOB_NATIVE_ADVANCED_AD_ID: ${{ secrets.ADMOB_NATIVE_ADVANCED_AD_ID }}
      ADMOB_REWARDED_AD_ID: ${{ secrets.ADMOB_REWARDED_AD_ID }}
      ADMOB_REWARDED_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_REWARDED_INTERSTITIAL_AD_ID }}

      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate EnBlocks project
        shell: bash
        run: |
          set -Eeuo pipefail

          configured_dir="${{ vars.MONOREPO_DIRECTORY || 'EnBlocks' }}"
          configured_dir="${configured_dir%/}"

          if [[ -f "$configured_dir/package.json" ]]; then
            target_dir="$configured_dir"
          elif [[ -f "EnBlocks/package.json" ]]; then
            target_dir="EnBlocks"
          elif [[ -f "package.json" && -d "ios/App" ]]; then
            target_dir="."
          else
            echo "::error::Could not locate the EnBlocks project."
            exit 1
          fi

          target_dir="$(cd "$target_dir" && pwd)"
          echo "TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "Using project directory: $target_dir"

      - name: Validate release configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is missing}"
          : "${BUNDLE_ID:?BUNDLE_IDENTIFIER is missing}"
          : "${XCODE_SCHEME:?XCODE_SCHEME is missing}"
          : "${ADMOB_APP_ID:?ADMOB_APP_ID is missing}"
          : "${ADMOB_BANNER_AD_ID:?ADMOB_BANNER_AD_ID is missing}"
          : "${ADMOB_INTERSTITIAL_AD_ID:?ADMOB_INTERSTITIAL_AD_ID is missing}"
          : "${ADMOB_REWARDED_AD_ID:?ADMOB_REWARDED_AD_ID is missing}"

          echo "Apple Team ID is configured."
          echo "Bundle ID: $BUNDLE_ID"
          echo "Xcode scheme: $XCODE_SCHEME"

      - name: Validate EnBlocks project structure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$TARGET_DIR"

          required_paths=(
            "package.json"
            "package-lock.json"
            "capacitor.config.json"
            "www/index.html"
            "www/index.js"
            "ios/App/App.xcworkspace"
            "ios/App/App.xcodeproj"
            "ios/App/Podfile"
            "ios/App/App/Info.plist"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Missing required path: $TARGET_DIR/$path"
              exit 1
            fi
          done

          echo "Project structure is valid."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TARGET_DIR }}/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund --progress=false

      - name: Verify pinned Capacitor dependencies
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const pkg = require("./package.json");
          const deps = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
          const required = [
            "@capacitor/core",
            "@capacitor/cli",
            "@capacitor/ios",
            "@capacitor-community/admob"
          ];

          for (const name of required) {
            const version = deps[name];
            if (!version) {
              console.error(`Missing dependency: ${name}`);
              process.exit(1);
            }

            const isExactVersion = /^\d+\.\d+\.\d+$/.test(version);
            if (!isExactVersion) {
              console.error(`${name} must use an exact version. Found: ${version}`);
              process.exit(1);
            }

            console.log(`${name}: ${version}`);
          }
          NODE

      - name: Configure Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        env:
          CONFIG_APP_ID: ${{ env.BUNDLE_ID }}
          CONFIG_APP_NAME: ${{ env.APP_NAME }}
          CONFIG_ADMOB_APP_ID: ${{ env.ADMOB_APP_ID }}
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import json, os
          from pathlib import Path

          config_path = Path("capacitor.config.json")
          with config_path.open("r", encoding="utf-8") as f:
              config = json.load(f)

          config["appId"] = os.environ["CONFIG_APP_ID"]
          config["appName"] = os.environ["CONFIG_APP_NAME"]
          config["webDir"] = "www"

          plugins = config.setdefault("plugins", {})
          admob = plugins.setdefault("AdMob", {})
          admob["appId"] = os.environ["CONFIG_ADMOB_APP_ID"]

          with config_path.open("w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          PY

          echo "capacitor.config.json:"
          cat capacitor.config.json

      - name: Generate AdMob runtime config
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > www/admob-config.js <<EOF
          window.__ADMOB_CONFIG__ = {
            appId: "${ADMOB_APP_ID}",
            appOpen: "${ADMOB_APP_OPEN_AD_ID}",
            banner: "${ADMOB_BANNER_AD_ID}",
            interstitial: "${ADMOB_INTERSTITIAL_AD_ID}",
            nativeAdvanced: "${ADMOB_NATIVE_ADVANCED_AD_ID}",
            rewarded: "${ADMOB_REWARDED_AD_ID}",
            rewardedInterstitial: "${ADMOB_REWARDED_INTERSTITIAL_AD_ID}"
          };
          EOF

          echo "Generated www/admob-config.js"

      - name: Sync Capacitor iOS project
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          set -Eeuo pipefail
          npx cap sync ios

      - name: Configure Info.plist
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        env:
          PLIST_PATH: ios/App/App/Info.plist
        run: |
          set -Eeuo pipefail

          set_plist_value() {
            local key="$1"
            local type="$2"
            local value="$3"

            /usr/libexec/PlistBuddy -c "Set :$key $value" "$PLIST_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :$key $type $value" "$PLIST_PATH"
          }

          set_plist_value "GADApplicationIdentifier" "string" "$ADMOB_APP_ID"
          set_plist_value "NSUserTrackingUsageDescription" "string" "This identifier will be used to deliver personalized ads to you."
          set_plist_value "UIRequiresFullScreen" "bool" "true"
          set_plist_value "ITSAppUsesNonExemptEncryption" "bool" "false"

          echo "Configured Info.plist"
          /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST_PATH"

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          set -Eeuo pipefail

          if [[ -f "Podfile.lock" ]]; then
            pod install --deployment
          else
            echo "::warning::Podfile.lock is not committed."
            pod install
          fi

      - name: Validate signing secrets
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -Eeuo pipefail

          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${CERTIFICATE_BASE64:?Missing APPLE_CERTIFICATE_P12}"
          : "${CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASS}"
          : "${PROVISIONING_PROFILE_BASE64:?Missing BASE64_PROVISIONING_PROFILE}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing APP_STORE_CONNECT_KEY_ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID}"
          : "${ASC_KEY_CONTENT:?Missing APP_STORE_CONNECT_KEY_CONTENT}"

      - name: Import Apple distribution certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: "temporary-keychain-${{ github.run_id }}"
        run: |
          set -Eeuo pipefail

          certificate_path="$RUNNER_TEMP/build_certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -s "$keychain_path"

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        shell: bash
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE }}
        run: |
          set -Eeuo pipefail

          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"

          mkdir -p "$profile_dir"

          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$profile_plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$profile_plist")

          if [[ "$profile_app_id" != *"$BUNDLE_ID" ]]; then
            echo "::error::Provisioning profile does not match $BUNDLE_ID"
            echo "::error::Profile application identifier: $profile_app_id"
            exit 1
          fi

          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"

          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $profile_uuid"

      - name: Set iOS version and build number
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail

          plist="App/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$plist"

      - name: Archive iOS app
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail

          archive_path="$RUNNER_TEMP/EnBlocks.xcarchive"
          log_path="$RUNNER_TEMP/xcodebuild.log"

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > "$log_path" 2>&1 || {
              echo "===== XCODEBUILD ERROR ====="
              cat "$log_path"
              exit 1
            }

          test -d "$archive_path/Products/Applications/App.app"

      - name: Create export options
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import os, plistlib
          from pathlib import Path

          options = {
              "method": "app-store-connect",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "destination": "export",
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_UUID"]
              }
          }

          with Path("exportOptions.plist").open("wb") as f:
              plistlib.dump(options, f)

          print("Created exportOptions.plist")
          PY

          plutil -lint exportOptions.plist

      - name: Export IPA
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          archive_path="$RUNNER_TEMP/EnBlocks.xcarchive"
          output_path="$TARGET_DIR/ios/App/output"

          rm -rf "$output_path"
          mkdir -p "$output_path"

          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$output_path"

          ipa_path="$(find "$output_path" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" || ! -f "$ipa_path" ]]; then
            echo "::error::No IPA was produced."
            exit 1
          fi

          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Validate signed app
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          app_path="$RUNNER_TEMP/EnBlocks.xcarchive/Products/Applications/App.app"

          codesign --verify --deep --strict --verbose=2 "$app_path"

          archive_bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app_path/Info.plist")
          if [[ "$archive_bundle_id" != "$BUNDLE_ID" ]]; then
            echo "::error::Expected bundle ID $BUNDLE_ID"
            echo "::error::Found bundle ID $archive_bundle_id"
            exit 1
          fi

          echo "Signed app validation passed."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnBlocks-iOS-${{ github.run_number }}
          path: ${{ env.TARGET_DIR }}/ios/App/output/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        working-directory: ${{ env.TARGET_DIR }}
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          api_keys_dir="$HOME/.appstoreconnect/private_keys"
          key_file="$api_keys_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          mkdir -p "$api_keys_dir"

          if [[ "$ASC_KEY_CONTENT" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY_CONTENT" > "$key_file"
          else
            echo "$ASC_KEY_CONTENT" | base64 --decode > "$key_file"
          fi

          chmod 600 "$key_file"

          xcrun altool \
            --upload-app \
            -t ios \
            -f "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"