name: EnBlocks - iOS (AdMob)

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'Build notes / TestFlight release description (Optional)'
        required: false
        default: 'Manual trigger following commit completion'
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    environment: MagicBlockBlitz-Environment
    
    steps:
    # ============================================================
    # 1. CHECKOUT
    # ============================================================
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    # ============================================================
    # 2. DETERMINE PROJECT DIRECTORY
    # ============================================================
    - name: Determine Target Directory
      shell: bash
      run: |
        set -e
        RAW_DIR="${{ vars.MONOREPO_DIRECTORY }}"
        RAW_DIR="${RAW_DIR%/}"
        if [ -n "$RAW_DIR" ] && [ -d "$RAW_DIR" ]; then
          TARGET_DIR="$RAW_DIR"
        elif [ -d "EnBlocks" ]; then
          TARGET_DIR="EnBlocks"
        else
          TARGET_DIR="."
        fi
        echo "Target Working Directory: $TARGET_DIR"
        echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

    # ============================================================
    # 3. NODE.JS
    # ============================================================
    - name: Setup Node.js
      uses: actions/setup-node@v4.2.0
      with:
        node-version: 22

    # ============================================================
    # 4. PREPARE HTML5 WEB APPLICATION
    # ============================================================
    - name: Prepare Web Directory
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        mkdir -p dist
        echo "Preparing HTML5 application..."
        for file in index.html index.js index.css; do
          if [ -f "www/$file" ]; then
            cp "www/$file" "dist/$file"
          elif [ -f "$file" ]; then
            cp "$file" "dist/$file"
          fi
        done
        if [ -d "www/assets" ]; then
          cp -R www/assets dist/
        elif [ -d "assets" ]; then
          cp -R assets dist/
        fi

    # ============================================================
    # 5. INSTALL PROJECT DEPENDENCIES
    # ============================================================
    - name: Install Dependencies
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        npm install --no-audit --no-fund --progress=false

    # ============================================================
    # 6. INSTALL CAPACITOR & ADMOB
    # ============================================================
    - name: Install Capacitor 6 & AdMob SDK
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        npm install --save-exact @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
        npm install @capacitor-community/admob@latest

    # ============================================================
    # 7. CONFIGURE CAPACITOR
    # ============================================================
    - name: Configure Capacitor
      working-directory: ${{ env.TARGET_DIR }}
      env:
        APP_ID_VAR: ${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}
        APP_NAME_VAR: ${{ vars.APP_NAME || 'Magic Block Blitz 2026' }}
      shell: bash
      run: |
        set -e
        ruby -e '
          require "json"
          config = {
            "appId" => ENV["APP_ID_VAR"],
            "appName" => ENV["APP_NAME_VAR"],
            "webDir" => "dist"
          }
          File.write("capacitor.config.json", JSON.pretty_generate(config))
        '

    # ============================================================
    # 8. SYNC IOS PLATFORM (WITH POD SIGNING & CONFIG FIX)
    # ============================================================
    - name: Add / Sync iOS Native Platform
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        export COCOAPODS_DISABLE_STATS=true

        # Inject AdMob configuration into capacitor.config.json if present
        python3 << 'EOF'
        import json, os
        cfg_path = "capacitor.config.json"
        if os.path.exists(cfg_path):
            with open(cfg_path, "r") as f:
                data = json.load(f)
            if "plugins" not in data:
                data["plugins"] = {}
            data["plugins"]["AdMob"] = {
                "appId": "ca-app-pub-2658659289706339~4005585343"
            }
            with open(cfg_path, "w") as f:
                json.dump(data, f, indent=2)
            print("Updated capacitor.config.json with AdMob config")
        EOF

        if [ ! -d "ios" ]; then
          npx cap add ios
        fi

        python3 << 'EOF'
        import re, os
        p = "ios/App/Podfile"
        if os.path.exists(p):
            data = open(p).read()
            
            # Update Podfile target to iOS 15.0
            updated = re.sub(r"platform :ios, .*", "platform :ios, \"15.0\"", data)
            
            # Strip code signing requirements from Pods to prevent xcodebuild archiving errors
            pod_fix = "\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      config.build_settings[\"IPHONEOS_DEPLOYMENT_TARGET\"] = \"15.0\"\n    end\n  end"
            
            if "CODE_SIGNING_ALLOWED" not in updated:
                if "post_install do |installer|" in updated:
                    updated = updated.replace("post_install do |installer|", "post_install do |installer|" + pod_fix)
                else:
                    updated += "\npost_install do |installer|" + pod_fix + "\nend\n"
            open(p, "w").write(updated)
            print("Updated Podfile minimum deployment target to iOS 15.0 and disabled Pod signing")

        pbx = "ios/App/App.xcodeproj/project.pbxproj"
        if os.path.exists(pbx):
            data = open(pbx).read()
            # Update Xcode project target to iOS 15.0
            updated = re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [0-9\.]+;", "IPHONEOS_DEPLOYMENT_TARGET = 15.0;", data)
            open(pbx, "w").write(updated)
            print("Updated project.pbxproj deployment target to 15.0")
        EOF

        npx cap sync ios

    # ============================================================
    # 9. CONFIGURE ADMOB, ATT & IPAD UI IN INFO.PLIST
    # ============================================================
    - name: Inject AdMob Credentials, SKAdNetwork & iPad Screen Rules
      working-directory: ${{ env.TARGET_DIR }}
      env:
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-2658659289706339~4005585343' }}
      shell: bash
      run: |
        python3 << 'EOF'
        import os, plistlib

        plist_path = "ios/App/App/Info.plist"
        if not os.path.exists(plist_path):
            print(f"Error: {plist_path} not found")
            exit(1)

        with open(plist_path, "rb") as f:
            plist = plistlib.load(f)

        # 1. GADApplicationIdentifier
        admob_id = os.environ.get("ADMOB_APP_ID", "").strip()
        if not admob_id or not admob_id.startswith("ca-app-pub-"):
            admob_id = "ca-app-pub-2658659289706339~4005585343"
        admob_id = admob_id.replace("'", "").replace('"', "")
        plist["GADApplicationIdentifier"] = admob_id
        print(f"Set GADApplicationIdentifier to {admob_id}")

        # 2. ATT Usage Description
        plist["NSUserTrackingUsageDescription"] = "This identifier will be used to deliver personalized ads to you."

        # 3. Complete Google SKAdNetwork Identifiers
        sk_ids = [
            "cstr6suwn9.skadnetwork", "4d12p84t66.skadnetwork", "v9wttpbfk9.skadnetwork",
            "n38lu8d63t.skadnetwork", "2383xqvh23.skadnetwork", "24t9a8vw3c.skadnetwork",
            "252b538255.skadnetwork", "38pubd86ve.skadnetwork", "3qcr597p3d.skadnetwork",
            "3qy4746463.skadnetwork", "3sh42y64q3.skadnetwork", "424m5254lk.skadnetwork",
            "4468km3ulz.skadnetwork", "44jz63fc85.skadnetwork", "488r3q3dtq.skadnetwork",
            "4fzdc2evr5.skadnetwork", "523jb4ffd3.skadnetwork", "52fl2v3hg5.skadnetwork",
            "578prtvx9j.skadnetwork", "5a6flpkh64.skadnetwork", "5l3tpt756e.skadnetwork",
            "5lm9lj6jb7.skadnetwork", "7375d33w16.skadnetwork", "7ug5zh24hu.skadnetwork",
            "9rd84892mo.skadnetwork", "9t245vhmpl.skadnetwork", "av6w8kgt66.skadnetwork",
            "c6k4g5qg8m.skadnetwork", "cp8zw746q7.skadnetwork", "e5fvk72637.skadnetwork",
            "ejvt5qm6qe.skadnetwork", "f38h382jlk.skadnetwork", "f73kdq92p3.skadnetwork",
            "g28c52ee13.skadnetwork", "glqzh8vgby.skadnetwork", "hs6bdukanm.skadnetwork",
            "kbd757ywx3.skadnetwork", "klf5c3l555.skadnetwork", "lr835er364.skadnetwork",
            "mlmmfcn3ed.skadnetwork", "mtkv5xtpkg.skadnetwork", "p78axxw29g.skadnetwork",
            "4pfyvq9l8r.skadnetwork", "ppxm28t8ap.skadnetwork", "prcb7njmu6.skadnetwork",
            "s39g8k73mm.skadnetwork", "t38b2kh725.skadnetwork", "tl55sbb4fm.skadnetwork",
            "u67928k2ce.skadnetwork", "v72qych54b.skadnetwork", "wzmmz9fp6w.skadnetwork",
            "yclnxrl5pm.skadnetwork", "ydx93a7ass.skadnetwork", "wg4vff78zm.skadnetwork"
        ]
        existing_sk = plist.get("SKAdNetworkItems", [])
        existing_ids = set()
        if isinstance(existing_sk, list):
            for item in existing_sk:
                if isinstance(item, dict) and "SKAdNetworkIdentifier" in item:
                    existing_ids.add(item["SKAdNetworkIdentifier"])
        else:
            existing_sk = []

        for sk_id in sk_ids:
            if sk_id not in existing_ids:
                existing_sk.append({"SKAdNetworkIdentifier": sk_id})
                existing_ids.add(sk_id)

        plist["SKAdNetworkItems"] = existing_sk

        # 4. Require Full Screen & Explicit iPad Launch Settings
        # Prevents iPadOS split-screen multitasking coordinate & safe area crashes
        plist["UIRequiresFullScreen"] = True
        plist["UILaunchStoryboardName"] = "LaunchScreen"
        plist["UISupportedInterfaceOrientations"] = ["UIInterfaceOrientationPortrait"]
        plist["UISupportedInterfaceOrientations~ipad"] = [
            "UIInterfaceOrientationPortrait",
            "UIInterfaceOrientationPortraitUpsideDown",
            "UIInterfaceOrientationLandscapeLeft",
            "UIInterfaceOrientationLandscapeRight"
        ]

        # 5. Export Compliance
        plist["ITSAppUsesNonExemptEncryption"] = False

        with open(plist_path, "wb") as f:
            plistlib.dump(plist, f)

        print("Successfully updated Info.plist via plistlib")
        EOF

    # ============================================================
    # 10. GENERATE APP ICONS
    # ============================================================
    - name: Generate App Icons
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        npm install -g @capacitor/assets
        if [ -f "assets/icon.png" ] || [ -f "assets/logo.png" ]; then
          echo "Generating icons from assets/..."
          npx capacitor-assets generate --ios --assetPath assets
        elif [ -f "www/assets/icon.png" ] || [ -f "www/assets/logo.png" ]; then
          echo "Generating icons from www/assets/..."
          npx capacitor-assets generate --ios --assetPath www/assets
        else
          echo "WARNING: No icon.png found in assets/ or www/assets/. App will build with default Capacitor icons."
        fi

    # ============================================================
    # 11. IMPORT APPLE CERTIFICATES & PROFILES
    # ============================================================
    - name: Import Apple Distribution Certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 || secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
        P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS || secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: "temp_keychain_pass_${{ github.run_id }}"
      shell: bash
      run: |
        set -e
        CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        
        python3 -c '
        import base64, os
        cert_b64 = os.environ.get("BUILD_CERTIFICATE_BASE64", "")
        cert_path = os.environ["RUNNER_TEMP"] + "/build_certificate.p12"
        with open(cert_path, "wb") as f:
            f.write(base64.b64decode(cert_b64.strip()))
        '
        
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
        security default-keychain -s "$KEYCHAIN_PATH"

    - name: Install Provisioning Profile
      env:
        PROVISIONING_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE }}
      shell: bash
      run: |
        set -e
        PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$PP_DIR"
        PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
        
        python3 -c '
        import base64, os
        prof_b64 = os.environ.get("PROVISIONING_PROFILE_BASE64", "")
        clean_b64 = "".join(prof_b64.split())
        with open(os.environ["RUNNER_TEMP"] + "/profile.mobileprovision", "wb") as f:
            f.write(base64.b64decode(clean_b64))
        '
        
        security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
        cp "$PROFILE_PATH" "$PP_DIR/$PROFILE_UUID.mobileprovision"
        echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

    # ============================================================
    # 12. BUMP VERSION & INSTALL COCOAPODS
    # ============================================================
    - name: Bump iOS Version
      working-directory: ${{ env.TARGET_DIR }}
      env:
        RUN_NUMBER: ${{ github.run_number }}
      shell: bash
      run: |
        python3 -c '
        import subprocess, os
        plist = "ios/App/App/Info.plist"
        run_num = os.environ.get("RUN_NUMBER", "1")
        
        for key, val in [("CFBundleShortVersionString", "1.0.4"), ("CFBundleVersion", run_num)]:
            c1 = subprocess.run(["/usr/libexec/PlistBuddy", "-c", f"Set :{key} {val}", plist])
            if c1.returncode != 0:
                subprocess.run(["/usr/libexec/PlistBuddy", "-c", f"Add :{key} string {val}", plist])
        '

    - name: Configure Podfile and Install CocoaPods
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        rm -rf Pods Podfile.lock 2>/dev/null
        pod cache clean --all
        pod install --repo-update

    # ============================================================
    # 13. BUILD AND ARCHIVE IOS APP (ARM64 & ARM64E COMPATIBLE)
    # ============================================================
    - name: Build and Archive iOS App
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      env:
        XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        PROFILE_UUID: ${{ env.PROFILE_UUID }}
      shell: bash
      run: |
        # Note: EXCLUDED_ARCHS is intentionally omitted to allow full arm64/arm64e support for M3/M4 Apple Silicon iPads
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme "$XCODE_SCHEME" \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath "$RUNNER_TEMP/App.xcarchive" \
          IPHONEOS_DEPLOYMENT_TARGET=15.0 \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
          > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { echo "=== XCODEBUILD ERROR LOG ==="; cat "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

    # ============================================================
    # 14. EXPORT IPA
    # ============================================================
    - name: Export IPA Package
      working-directory: ${{ env.TARGET_DIR }}
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        PROFILE_UUID: ${{ env.PROFILE_UUID }}
        BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}
      shell: bash
      run: |
        set -e
        cat > exportOptions.plist << 'PLIST_EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>teamID</key>
          <string>$APPLE_TEAM_ID</string>
          <key>provisioningProfiles</key>
          <dict>
            <key>$BUNDLE_ID</key>
            <string>$PROFILE_UUID</string>
          </dict>
        </dict>
        </plist>
        PLIST_EOF
        
        python3 -c '
        import os
        with open("exportOptions.plist", "r") as f:
            content = f.read()
        content = content.replace("$APPLE_TEAM_ID", os.environ.get("APPLE_TEAM_ID", ""))
        content = content.replace("$BUNDLE_ID", os.environ.get("BUNDLE_ID", ""))
        content = content.replace("$PROFILE_UUID", os.environ.get("PROFILE_UUID", ""))
        with open("exportOptions.plist", "w") as f:
            f.write(content)
        '
        
        mkdir -p ios/App/output
        xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist exportOptions.plist -exportPath ios/App/output

    # ============================================================
    # 15. UPLOAD ARTIFACTS
    # ============================================================
    - name: Upload Signed IPA
      uses: actions/upload-artifact@v4.6.1
      with:
        name: MagicBlockBlitz2026-iOS-Release
        path: ${{ env.TARGET_DIR }}/ios/App/output/*.ipa

    # ============================================================
    # 16. UPLOAD TO APP STORE CONNECT
    # ============================================================
    - name: Upload to TestFlight
      if: success()
      working-directory: ${{ env.TARGET_DIR }}
      env:
        KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID || 'C6HLRTWSC2' }}
        ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID || '2e4974f6-27d6-476e-9322-0a79cff7bf00' }}
        KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      shell: bash
      run: |
        set -e
        API_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$API_KEYS_DIR"
        KEY_FILE="$API_KEYS_DIR/AuthKey_${KEY_ID}.p8"
        export KEY_FILE
        
        python3 -c '
        import base64, os
        key_content = os.environ.get("KEY_CONTENT", "")
        key_file = os.environ.get("KEY_FILE", "")
        try:
            decoded = base64.b64decode(key_content).decode("utf-8")
            if "BEGIN PRIVATE KEY" in decoded:
                with open(key_file, "w") as f:
                    f.write(decoded)
            else:
                with open(key_file, "w") as f:
                    f.write(key_content)
        except Exception:
            with open(key_file, "w") as f:
                f.write(key_content)
        '
        chmod 600 "$KEY_FILE"
        
        IPA_PATH=$(find ios/App/output -name "*.ipa" -print)
        xcrun altool --upload-app -t ios -f "$IPA_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
