name: Build EnBlocks - iOS

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'Build notes / TestFlight release description (Optional)'
        required: false
        default: 'Manual trigger following commit completion'
        type: string

permissions:
  contents: read

jobs: 
  build-ios:
    runs-on: macos-latest
    environment: MagicBlockBlitz-Environment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Step 1 - Prepare the HTML5 Game
        run: |
          # Use hardcoded path to match repository structure
          TARGET_DIR="EnBlocks"
          
          echo "Target Working Directory resolved to: $TARGET_DIR"
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with: 
          node-version: 22

      - name: Install Dependencies
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --progress=false
          else
            npm install --no-audit --no-fund --no-progress
          fi

      - name: Prepare Web Directory (HTML5 Build)
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          mkdir -p dist
          # Make paths relative to TARGET_DIR and use -f to force overwrite, ignoring errors if missing
          cp -f www/index.html www/index.js www/index.css www/manifest.json www/service-worker.js dist/ || true
          cp -R www/assets dist/ || true

      - name: Step 2 - Generate the iOS Project with Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}",
            "appName": "${{ vars.APP_NAME || 'Magic Block Blitz 2026' }}",
            "webDir": "dist"
          }
          EOF
          npm install @capacitor/ios@6 --no-save
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            npx cap sync ios
          fi

      - name: Step 2.5 - Generate Native iOS App Icons (App Store Compliance)
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          echo "Checking for icon source to satisfy Apple Guideline 2.3.8..."
          mkdir -p assets
          
          # Attempt to locate the primary app icon from web assets
          if [ -f "www/assets/icon.png" ]; then
            cp www/assets/icon.png assets/icon.png
          elif [ -f "www/icon.png" ]; then
            cp www/icon.png assets/icon.png
          elif [ -f "dist/assets/icon.png" ]; then
            cp dist/assets/icon.png assets/icon.png
          fi
          
          if [ -f "assets/icon.png" ]; then
            echo "Icon found. Generating native iOS App Store assets..."
            npx --yes @capacitor/assets generate --ios
          else
            echo "❌ ERROR: No icon.png found in www/ or dist/ folders."
            echo "Failing build to prevent App Store rejection (Placeholder Icons)."
            echo "Please ensure you have an 'icon.png' (1024x1024 recommended) in your web assets."
            exit 1
          fi

      - name: Step 3 - Configure the Generated Project in Xcode (Signing & Versioning)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 || secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS || secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: "temp_keychain_pass_${{ github.run_id }}"
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE || secrets.APPLE_PROVISION_PROFILE || secrets.PROVISIONING_PROFILE_BASE64 }}
          FALLBACK_BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}
          FALLBACK_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID || vars.APPLE_TEAM_ID || 'XHNXQ72KYZ' }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::Missing required secret: APPLE_CERTIFICATE_P12 or APPLE_DISTRIBUTION_CERT_P12_BASE64"
            exit 1
          fi

          if [ -z "${P12_PASSWORD:-}" ]; then
            echo "::error::Missing required secret: APPLE_CERTIFICATE_PASS or P12_PASSWORD"
            exit 1
          fi

          if [ -z "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "::error::Missing required secret: BASE64_PROVISIONING_PROFILE or APPLE_PROVISION_PROFILE or PROVISIONING_PROFILE_BASE64"
            exit 1
          fi

          # 1. Setup Keychain and Certificate
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "Decoding signing certificate to $CERTIFICATE_PATH"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Certificate decode produced an empty file. Check APPLE_CERTIFICATE_P12 / APPLE_DISTRIBUTION_CERT_P12_BASE64." 
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          # 2. Setup Provisioning Profile
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          PLIST_PATH="$RUNNER_TEMP/profile.plist"

          echo "Decoding provisioning profile to $PP_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          if [ ! -s "$PP_PATH" ]; then
            echo "::error::Provisioning profile decode produced an empty file. Check BASE64_PROVISIONING_PROFILE / APPLE_PROVISION_PROFILE / PROVISIONING_PROFILE_BASE64."
            exit 1
          fi

          security cms -D -i "$PP_PATH" > "$PLIST_PATH"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST_PATH" 2>/dev/null || true)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PLIST_PATH" 2>/dev/null || echo "$FALLBACK_TEAM_ID")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PLIST_PATH" 2>/dev/null || true)
          RAW_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST_PATH" 2>/dev/null || true)

          if [ -z "$PROFILE_UUID" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::Provisioning profile is invalid or unreadable. Ensure the correct provisioning profile secret is configured and matches the app's bundle ID/team."
            exit 1
          fi

          BUNDLE_ID=$(echo "$RAW_APP_ID" | sed 's/^[^.]*\.//')
          if [ -z "$BUNDLE_ID" ] || [ "$BUNDLE_ID" = "*" ]; then
            BUNDLE_ID="$FALLBACK_BUNDLE_ID"
          fi

          if [ -n "${FALLBACK_BUNDLE_ID:-}" ] && [ "$BUNDLE_ID" != "$FALLBACK_BUNDLE_ID" ]; then
            echo "::error::Provisioning profile bundle ID mismatch. Profile says: $BUNDLE_ID, app expects: $FALLBACK_BUNDLE_ID. Update the provisioning profile or bundle identifier to match."
            exit 1
          fi

          echo "Bundle ID: ${BUNDLE_ID}"
          echo "Profile UUID: ${PROFILE_UUID}"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          # 3. Increment Version and Build Number via agvtool
          cd ${{ env.TARGET_DIR }}/ios/App
          xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Step 4 - Add App Resources and Native SDKs (Privacy & Permissions Compliance)
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        run: |
          if ! pod install; then
            echo "pod install failed; refreshing CocoaPods repo and retrying..."
            pod repo update
            pod install
          fi

          if [ -f Pods/Pods.xcodeproj/project.pbxproj ]; then
            echo "Resetting CocoaPods target signing to automatic/disabled before archive..."
            python3 - "$PWD" <<'PY'
            from pathlib import Path
            import re
            import sys
            root = Path(sys.argv[1])
            p = root / 'Pods/Pods.xcodeproj/project.pbxproj'
            text = p.read_text()
            for field in (
                'PROVISIONING_PROFILE_SPECIFIER',
                'PROVISIONING_PROFILE',
                'DEVELOPMENT_TEAM',
                'CODE_SIGN_STYLE',
                'CODE_SIGNING_REQUIRED',
                'CODE_SIGNING_ALLOWED',
            ):
                text = re.sub(rf'^\s*{field} = .*?;\n', '', text, flags=re.M)
            text = re.sub(r'CODE_SIGNING_ALLOWED = YES;', 'CODE_SIGNING_ALLOWED = NO;', text)
            text = re.sub(r'CODE_SIGNING_REQUIRED = YES;', 'CODE_SIGNING_REQUIRED = NO;', text)
            text = re.sub(r'CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Automatic;', text)
            text = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = ".*?";', 'PROVISIONING_PROFILE_SPECIFIER = "";', text)
            text = re.sub(r'PROVISIONING_PROFILE = ".*?";', 'PROVISIONING_PROFILE = "";', text)
            text = re.sub(r'DEVELOPMENT_TEAM = ".*?";', 'DEVELOPMENT_TEAM = "";', text)
            p.write_text(text)
            PY
            echo "Pods signing cleanup complete."
            grep -nE 'PROVISIONING_PROFILE|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGNING_ALLOWED = YES|CODE_SIGN_STYLE = Manual|DEVELOPMENT_TEAM = ' Pods/Pods.xcodeproj/project.pbxproj | head -n 60 || true
          fi
          
          # Enforce Apple Privacy Manifest
          cd App
          if [ ! -f PrivacyInfo.xcprivacy ]; then
            echo "Creating default PrivacyInfo.xcprivacy to comply with Apple Store policies..."
            echo '<?xml version="1.0" encoding="UTF-8"?>' > PrivacyInfo.xcprivacy
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> PrivacyInfo.xcprivacy
            echo '<plist version="1.0">' >> PrivacyInfo.xcprivacy
            echo '<dict>' >> PrivacyInfo.xcprivacy
            echo '    <key>NSPrivacyTracking</key><false/>' >> PrivacyInfo.xcprivacy
            echo '    <key>NSPrivacyTrackingDomains</key><array/>' >> PrivacyInfo.xcprivacy
            echo '    <key>NSPrivacyAccessedAPITypes</key>' >> PrivacyInfo.xcprivacy
            echo '    <array>' >> PrivacyInfo.xcprivacy
            echo '        <dict>' >> PrivacyInfo.xcprivacy
            echo '            <key>NSPrivacyAccessedAPIType</key>' >> PrivacyInfo.xcprivacy
            echo '            <string>NSPrivacyAccessedAPICategoryUserDefaults</string>' >> PrivacyInfo.xcprivacy
            echo '            <key>NSPrivacyAccessedAPITypeReasons</key>' >> PrivacyInfo.xcprivacy
            echo '            <array><string>CA92.1</string></array>' >> PrivacyInfo.xcprivacy
            echo '        </dict>' >> PrivacyInfo.xcprivacy
            echo '    </array>' >> PrivacyInfo.xcprivacy
            echo '    <key>NSPrivacyCollectedDataTypes</key><array/>' >> PrivacyInfo.xcprivacy
            echo '</dict>' >> PrivacyInfo.xcprivacy
            echo '</plist>' >> PrivacyInfo.xcprivacy
          fi

      - name: Configure Native Xcode Signing
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        run: |
          PBXPROJ="App.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = .*/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ" || true
            sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${{ env.APPLE_TEAM_ID }};/g" "$PBXPROJ" || true
            sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"${{ env.PROFILE_UUID }}\";/g" "$PBXPROJ" || true
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};/g" "$PBXPROJ" || true
          fi

          if [ -f "App.xcodeproj/xcshareddata/xcschemes/App.xcscheme" ]; then
            sed -i '' "s/BuildableIdentifier = \".*\"/BuildableIdentifier = \"primary\"/g" "App.xcodeproj/xcshareddata/xcschemes/App.xcscheme" || true
          fi

      - name: Step 5 - Test the Application (Simulator Verification)
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        env:
          XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
        run: |
          echo "Running a dry-run build on the iOS Simulator to verify architecture, SDKs, and integrity..."
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme "${XCODE_SCHEME}" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      - name: Step 6 - Archive the Application
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
        run: |
          echo "Archive bundle id: ${BUNDLE_ID}"
          echo "Archive profile UUID: ${PROFILE_UUID}"

          if grep -Eq 'PROVISIONING_PROFILE_SPECIFIER = .*|PROVISIONING_PROFILE = .*|CODE_SIGNING_ALLOWED = YES|CODE_SIGN_STYLE = Manual|DEVELOPMENT_TEAM = ' Pods/Pods.xcodeproj/project.pbxproj; then
            echo "::error::Pods project still contains provisioning profile settings. Clearing failed."
            grep -nE 'PROVISIONING_PROFILE|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGNING_ALLOWED|DEVELOPMENT_TEAM|CODE_SIGN_STYLE' Pods/Pods.xcodeproj/project.pbxproj | head -n 80 || true
            exit 1
          fi

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme "${XCODE_SCHEME}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            CODE_SIGNING_REQUIRED=YES \
            -allowProvisioningUpdates \
            -quiet

      - name: Export IPA Package (Validate Archive for App Store)
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          mkdir -p ios/App/output
          python3 -c 'from pathlib import Path; Path("ios/App/exportOptions.plist").write_text("""<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\">\n<dict>\n  <key>method</key>\n  <string>app-store-connect</string>\n  <key>teamID</key>\n  <string>${{ env.APPLE_TEAM_ID }}</string>\n  <key>signingStyle</key>\n  <string>manual</string>\n  <key>signingCertificate</key>\n  <string>Apple Distribution</string>\n  <key>compileBitcode</key>\n  <false/>\n  <key>manageAppVersionAndBuildNumber</key>\n  <true/>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>${{ env.BUNDLE_ID }}</key>\n    <string>${{ env.PROFILE_UUID }}</string>\n  </dict>\n</dict>\n</plist>\n""")'
          
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ios/App/output \
            -quiet

      - name: Verify IPA Output
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          IPA_PATH=$(find ios/App/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA file found in output directory"
            exit 1
          fi
          echo "IPA location: $IPA_PATH"

      - name: Upload Signed IPA to Workflow Artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: MagicBlockBlitz2026-iOS-Release
          path: ${{ env.TARGET_DIR }}/ios/App/output/*.ipa

      - name: Step 7 - Upload to App Store Connect
        if: success()
        working-directory: ${{ env.TARGET_DIR }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID || 'C6HLRTWSC2' }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID || '2e4974f6-27d6-476e-9322-0a79cff7bf00' }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_NOTES: ${{ inputs.build_notes }}
        run: |
          set -euo pipefail

          if [ -z "${KEY_ID:-}" ]; then
            echo "::error::Missing required App Store Connect secret/variable: APP_STORE_CONNECT_KEY_ID"
            exit 1
          fi

          if [ -z "${ISSUER_ID:-}" ]; then
            echo "::error::Missing required App Store Connect secret/variable: APP_STORE_CONNECT_ISSUER_ID"
            exit 1
          fi

          if [ -z "${KEY_CONTENT:-}" ]; then
            echo "::error::Missing required App Store Connect secret: APP_STORE_CONNECT_KEY_CONTENT or APP_STORE_CONNECT_PRIVATE_KEY"
            exit 1
          fi

          API_KEYS_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$API_KEYS_DIR"
          KEY_FILE="$API_KEYS_DIR/AuthKey_$KEY_ID.p8"

          CLEAN_KEY=$(echo "$KEY_CONTENT" | tr -d '\r')
          if echo "$CLEAN_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$CLEAN_KEY" > "$KEY_FILE"
          else
            echo "$CLEAN_KEY" | base64 --decode > "$KEY_FILE" 2>/dev/null || echo "$CLEAN_KEY" > "$KEY_FILE"
          fi

          sed -i '' 's/\r$//' "$KEY_FILE" 2>/dev/null || sed -i 's/\r$//' "$KEY_FILE" 2>/dev/null || true
          chmod 600 "$KEY_FILE"

          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            echo "::error::App Store Connect key file does not contain a valid '-----BEGIN PRIVATE KEY-----' header. Check APP_STORE_CONNECT_KEY_CONTENT / APP_STORE_CONNECT_PRIVATE_KEY."
            exit 1
          fi

          IPA_PATH=$(find ios/App/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA package found to upload. Ensure the export/archive step succeeded."
            exit 1
          fi

          echo "Uploading $IPA_PATH to App Store Connect..."
          echo "Build notes: $BUILD_NOTES"

          xcrun altool --upload-app \
            -t ios \
            -f "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" || \
          echo "⚠️ If altool is deprecated in this Xcode version, ensure you migrate to xcrun iTMSTransporter or Fastlane for future submissions."
