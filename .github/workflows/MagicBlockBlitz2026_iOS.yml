name: Build EnBlocks - iOS

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'Build notes / TestFlight release description (Optional)'
        required: false
        default: 'Manual trigger following commit completion'
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    environment: MagicBlockBlitz-Environment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Target Directory
        shell: bash
        run: |
          RAW_DIR="${{ vars.MONOREPO_DIRECTORY }}"
          RAW_DIR="${RAW_DIR%/}"

          if [ -n "$RAW_DIR" ] && [ -d "$RAW_DIR" ]; then
            TARGET_DIR="$RAW_DIR"
          elif [ -d "EnBlocks" ]; then
            TARGET_DIR="EnBlocks"
          else
            TARGET_DIR="."
          fi

          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          echo "Target directory: $TARGET_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.TARGET_DIR }}/package-lock.json

      - name: Show Project Files
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          echo "=== Project ==="
          pwd
          echo "=== package.json ==="
          cat package.json
          echo "=== Capacitor packages ==="
          npm list @capacitor/core @capacitor/cli @capacitor/ios --depth=0 || true

      - name: Prepare Web Directory
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          mkdir -p dist

          for file in index.html index.js index.css manifest.json service-worker.js; do
            if [ -f "www/$file" ]; then
              cp "www/$file" dist/
            fi
          done

          if [ -d "www/assets" ]; then
            cp -R www/assets dist/
          fi

          echo "=== dist contents ==="
          find dist -maxdepth 2 -type f | sort

      - name: Install Dependencies
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --progress=false
          else
            npm install --no-audit --no-fund --progress=false
          fi

      - name: Install Capacitor 6
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          npm install --save-exact \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/ios@6

          echo "=== Capacitor versions ==="
          npx cap --version
          npm list @capacitor/core @capacitor/cli @capacitor/ios --depth=0

      - name: Configure Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}",
            "appName": "${{ vars.APP_NAME || 'Magic Block Blitz 2026' }}",
            "webDir": "dist"
          }
          EOF

          cat capacitor.config.json

      - name: Add / Sync iOS Platform
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          echo "=== Capacitor doctor ==="
          npx cap doctor || true

          if [ ! -d "ios" ]; then
            echo "iOS platform does not exist. Adding it..."
            npx cap add ios
          else
            echo "iOS platform already exists. Syncing..."
            npx cap sync ios
          fi

          echo "=== iOS directory ==="
          ls -la ios

      - name: Generate iOS Assets
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          mkdir -p assets

          if [ -f "www/assets/icon.png" ]; then
            cp www/assets/icon.png assets/icon.png
          elif [ -f "www/icon.png" ]; then
            cp www/icon.png assets/icon.png
          fi

          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --ios
          else
            echo "Warning: assets/icon.png not found."
          fi

      - name: Import Apple Distribution Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 || secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS || secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: "temp_keychain_pass_${{ github.run_id }}"
        shell: bash
        run: |
          set -e

          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "ERROR: Apple distribution certificate secret is empty."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE || secrets.APPLE_PROVISION_PROFILE || secrets.PROVISIONING_PROFILE_BASE64 }}
          FALLBACK_BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}
          FALLBACK_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID || vars.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -e

          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "ERROR: Provisioning profile secret is empty."
            exit 1
          fi

          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          PLIST_PATH="$RUNNER_TEMP/profile.plist"

          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security cms -D \
            -i "$PP_PATH" \
            -o "$PLIST_PATH"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" "$PLIST_PATH")

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" "$PLIST_PATH")

          TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" "$PLIST_PATH" || true)

          RAW_APP_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" "$PLIST_PATH")

          BUNDLE_ID="${RAW_APP_ID#*.}"

          if [ -z "$BUNDLE_ID" ] || [ "$BUNDLE_ID" = "*" ]; then
            BUNDLE_ID="$FALLBACK_BUNDLE_ID"
          fi

          if [ -z "$TEAM_ID" ]; then
            TEAM_ID="$FALLBACK_TEAM_ID"
          fi

          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          cp "$PP_PATH" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "Profile: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"

      - name: Install CocoaPods
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          pod install --repo-update

      - name: Configure Xcode Signing
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          PBXPROJ="App.xcodeproj/project.pbxproj"

          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: Xcode project not found."
            exit 1
          fi

          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PBXPROJ" || true

          sed -i '' \
            "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" \
            "$PBXPROJ" || true

          sed -i '' \
            "s/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\";/g" \
            "$PBXPROJ" || true

      - name: Create Privacy Manifest
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          if [ ! -f App/PrivacyInfo.xcprivacy ]; then
            cat > App/PrivacyInfo.xcprivacy <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSPrivacyTracking</key>
              <false/>
              <key>NSPrivacyTrackingDomains</key>
              <array/>
              <key>NSPrivacyCollectedDataTypes</key>
              <array/>
              <key>NSPrivacyAccessedAPITypes</key>
              <array/>
          </dict>
          </plist>
          EOF
          fi

      - name: Build and Archive iOS App
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        env:
          XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
        shell: bash
        run: |
          set -o pipefail

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Export IPA
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -e

          mkdir -p ios/App/output

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>

            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>signingCertificate</key>
            <string>Apple Distribution</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ios/App/output

      - name: Verify IPA
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          IPA_PATH=$(find ios/App/output -name "*.ipa" -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found."
            exit 1
          fi

          echo "IPA: $IPA_PATH"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicBlockBlitz2026-iOS-Release
          path: ${{ env.TARGET_DIR }}/ios/App/output/*.ipa