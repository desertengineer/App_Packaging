name: Build EnBlocks - iOS

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'Build notes / TestFlight release description (Optional)'
        required: false
        default: 'Manual trigger following commit completion'
        type: string

permissions:
  contents: read

jobs: 
  build-ios:
    runs-on: macos-latest
    environment: MagicBlockBlitz-Environment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Step 1 - Prepare the HTML5 Game
        run: |
          # Use hardcoded path to match repository structure
          TARGET_DIR="EnBlocks"
          
          echo "Target Working Directory resolved to: $TARGET_DIR"
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Debug Workspace & File Structure
        run: |
          echo "--- Root Directory Contents ---"
          ls -la
          echo "--- EnBlocks Directory Contents ---"
          ls -la EnBlocks/ || echo "❌ EnBlocks folder not found!"
          echo "--- EnBlocks/www Directory Contents ---"
          ls -la EnBlocks/www/ || echo "❌ www folder not found on GitHub! Please check your local .gitignore file, commit the folder, and push!"

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22

      - name: Step 1 - Prepare the HTML5 Game (Validate Assets)
        working-directory: ./EnBlocks
        run: |
          if [ ! -d "www" ]; then
            echo "❌ Error: 'www' directory not found inside $(pwd)!"
            echo "Git did not upload your www folder. Please remove 'www' from your .gitignore file, commit, and push again."
            exit 1
          fi

          mkdir -p dist
          cp -R www/* dist/ || echo "Warning: Failed to copy some files, continuing..."

          if [ ! -f "dist/index.html" ]; then
            echo "❌ Error: index.html failed to copy into dist/!"
            exit 1
          fi
          echo "✅ Web build assets successfully validated and prepared in dist/."

      - name: Install Node Dependencies
        working-directory: ./EnBlocks
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --progress=false
          else
            npm install --no-audit --no-fund --no-progress
          fi
          npm install @capacitor/core@^6.0.0 @capacitor/ios@^6.0.0 --save

      - name: Step 2 - Generate the iOS Project with Capacitor
        working-directory: ./EnBlocks
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}",
            "appName": "${{ vars.APP_NAME || 'Magic Block Blitz 2026' }}",
            "webDir": "dist"
          }
          EOF
          
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Step 3 - Configure the Generated Project in Xcode (Signing & Metadata)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 || secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS || secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: "temp_keychain_pass_${{ github.run_id }}"
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE || secrets.APPLE_PROVISION_PROFILE || secrets.PROVISIONING_PROFILE_BASE64 }}
          FALLBACK_BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}
          FALLBACK_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID || vars.APPLE_TEAM_ID || 'XHNXQ72KYZ' }}
        run: |
          # 1. Setup Keychain and Certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" \vert{} base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

          # 2. Setup Provisioning Profile
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          PLIST_PATH=$RUNNER_TEMP/profile.plist
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" \vert{} base64 --decode -o $PP_PATH
          security cms -D -i "$PP_PATH" > $PLIST_PATH
          
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $PLIST_PATH)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" $PLIST_PATH \vert{}\vert{} echo "$FALLBACK_TEAM_ID")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $PLIST_PATH)
          RAW_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" $PLIST_PATH)
          BUNDLE_ID=$(echo "$RAW_APP_ID" | sed 's/^[^.]*\.//')
          if [ -z "$BUNDLE_ID" ] \vert{}\vert{} [ "$BUNDLE_ID" = "*" ]; then
            BUNDLE_ID="$FALLBACK_BUNDLE_ID"
          fi
          
          echo "APPLE_TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          # 3. Configure Encryption Compliance (Info.plist)
          PLIST_PATH="EnBlocks/ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST_PATH"
          fi

          # 4. Configure Xcode Signing
          PBXPROJ="EnBlocks/ios/App/App.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = .*/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ" || true
            sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${TEAM_ID};/g" "$PBXPROJ" || true
            sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"${PROFILE_UUID}\";/g" "$PBXPROJ" || true
          fi

      - name: Step 4 - Add App Resources and Native SDKs
        working-directory: ./EnBlocks
        run: |
          mkdir -p assets
          if [ -f "www/assets/icon.png" ]; then
            cp www/assets/icon.png assets/icon.png
            npx --yes @capacitor/assets generate --ios
            echo "✅ Native iOS App Icons Generated."
          else
            echo "⚠️ Warning: assets/icon.png not found; skipping icon generation."
          fi

          cd ios/App
          pod install || pod repo update && pod install
          
          # Force Pods to not require manual signing
          if [ -f Pods/Pods.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' Pods/Pods.xcodeproj/project.pbxproj || true
          fi

      - name: Step 5 - Test the Application (Simulator Verification)
        working-directory: ./EnBlocks/ios/App
        env:
          XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
        run: |
          echo "Running a dry-run build on the iOS Simulator to verify architecture and integrity..."
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme "${XCODE_SCHEME}" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -quiet
          echo "✅ Simulator Verification Passed."

      - name: Step 6 - Archive the Application
        working-directory: ./EnBlocks/ios/App
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme "${XCODE_SCHEME}" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_UUID }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ env.BUNDLE_ID }}" \
            -quiet

      - name: Step 6.5 - Export IPA Package for Distribution
        working-directory: ./EnBlocks
        run: |
          mkdir -p ios/App/output
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ env.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key>
              <string>${{ env.PROFILE_UUID }}</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ios/App/output \
            -quiet

          IPA_PATH=$(find ios/App/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA file found in output directory"
            exit 1
          fi
          echo "✅ Exported IPA location: $IPA_PATH"

      - name: Upload Signed IPA to Workflow Artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: MagicBlockBlitz2026-iOS-Release
          path: EnBlocks/ios/App/output/*.ipa

      - name: Step 7 - Upload to App Store Connect
        if: success()
        working-directory: ./EnBlocks
        env:
          SECRET_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          VAR_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          SECRET_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VAR_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          SECRET_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          SECRET_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_NOTES: ${{ inputs.build_notes }}
        run: |
          KEY_ID="${SECRET_KEY_ID:-${VAR_KEY_ID:-C6HLRTWSC2}}"
          ISSUER_ID="${SECRET_ISSUER_ID:-${VAR_ISSUER_ID:-2e4974f6-27d6-476e-9322-0a79cff7bf00}}"
          KEY_CONTENT="${SECRET_KEY_CONTENT:-$SECRET_PRIVATE_KEY}"

          API_KEYS_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$API_KEYS_DIR"
          echo "$KEY_CONTENT" > "$API_KEYS_DIR/AuthKey_$KEY_ID.p8"
          chmod 600 "$API_KEYS_DIR/AuthKey_$KEY_ID.p8"
          
          IPA_PATH=$(find ios/App/output -name "*.ipa" | head -n 1)
          
          echo "Uploading $IPA_PATH to App Store Connect..."
          xcrun altool --upload-app \
            -t ios \
            -f "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
