name: Build Magic Block Blitz 2026 (iOS Only)

on:
  push:
    branches:
      - main
    paths:
      - "EnBlocks/**"
      - ".github/workflows/MagicBlockBlitz2026_Packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build & Deploy iOS Package
    runs-on: macos-latest
    environment: MagicBlockBlitz-Environment
    defaults:
      run:
        working-directory: ${{ vars.MONOREPO_DIRECTORY || 'EnBlocks/' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22

      - name: Prepare Web Directory (Root EnBlocks Layout)
        run: |
          mkdir -p dist
          cp -f index.html index.js index.css manifest.json service-worker.js dist/ 2>/devnull || true
          if [ -d "assets" ]; then
            cp -r assets dist/ 2>/devnull || true
          fi
          echo "Web build assets successfully prepared in dist/"

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --progress=false
          else
            npm install --no-audit --no-fund --no-progress
          fi

      - name: Inject Capacitor Configuration
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}",
            "appName": "${{ vars.APP_NAME || 'Magic Block Blitz 2026' }}",
            "webDir": "dist"
          }
          EOF

      - name: Sync iOS Native Platform
        run: |
          if [ ! -d "ios" ]; then
            npx --yes --package @capacitor/cli@6 cap add ios
          else
            npx --yes --package @capacitor/cli@6 cap sync ios
          fi

      - name: Generate Native iOS App Icons & Assets
        run: |
          if [ -f "assets/icon.png" ]; then
            npx --yes @capacitor/assets generate --ios
            echo "Native iOS icons generated successfully from assets/icon.png"
          else
            echo "Warning: assets/icon.png not found; skipping automated asset generation."
          fi

      - name: Set Export Compliance in Info.plist (Auto-Bypass TestFlight Warning)
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST_PATH" 2>/devnull || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST_PATH"
            echo "ITSAppUsesNonExemptEncryption successfully configured as false."
          fi

      - name: Import Apple Certificate to Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 || secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS || secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: "temp_keychain_pass_${{ github.run_id }}"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

      - name: Install Provisioning Profile & Extract Metadata
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE || secrets.APPLE_PROVISION_PROFILE || secrets.PROVISIONING_PROFILE_BASE64 }}
          FALLBACK_BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}
          FALLBACK_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID || vars.APPLE_TEAM_ID || 'XHNXQ72KYZ' }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          PLIST_PATH=$RUNNER_TEMP/profile.plist
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security cms -D -i "$PP_PATH" > $PLIST_PATH

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $PLIST_PATH)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" $PLIST_PATH || echo "$FALLBACK_TEAM_ID")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $PLIST_PATH)
          RAW_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" $PLIST_PATH)
          BUNDLE_ID=$(echo "$RAW_APP_ID" | sed 's/^[^.]*\.//')
          if [ -z "$BUNDLE_ID" ] || [ "$BUNDLE_ID" = "*" ]; then
            BUNDLE_ID="$FALLBACK_BUNDLE_ID"
          fi

          echo "APPLE_TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "Provisioning Profile Installed: $PROFILE_NAME ($PROFILE_UUID) for Bundle: $BUNDLE_ID (Team:$TEAM_ID)"

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod install || pod repo update && pod install

      - name: Build and Archive iOS App
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID || vars.APPLE_DEVELOPER_TEAM_ID || vars.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme "${XCODE_SCHEME}" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            -quiet

      - name: Ensure Export Compliance in Archive Info.plist
        run: |
          ARCHIVE_PLIST=$(find $RUNNER_TEMP/App.xcarchive -name "Info.plist" -type f | grep "App.app" || true)
          if [ -n "$ARCHIVE_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$ARCHIVE_PLIST" 2>/devnull || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$ARCHIVE_PLIST"
            echo "ITSAppUsesNonExemptEncryption ensured as false inside archive: $ARCHIVE_PLIST"
          fi

      - name: Export IPA Package
        run: |
          mkdir -p ios/App/output
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ env.APPLE_TEAM_ID || vars.APPLE_DEVELOPER_TEAM_ID || vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ios/App/output \
            -quiet

      - name: Verify IPA Output
        run: |
          IPA_PATH=$(find ios/App/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA file found in output directory"
            exit 1
          fi
          echo "IPA location: $IPA_PATH"

      - name: Upload Signed IPA to Workflow Artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: MagicBlockBlitz2026-iOS-Release
          path: ios/App/output/*.ipa

      - name: Upload to TestFlight / App Store Connect
        if: success()
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID || 'C6HLRTWSC2' }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID || '2e4974f6-27d6-476e-9322-0a79cff7bf00' }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          API_KEYS_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$API_KEYS_DIR"
          echo "$KEY_CONTENT" > "$API_KEYS_DIR/AuthKey_$KEY_ID.p8"
          chmod 600 "$API_KEYS_DIR/AuthKey_$KEY_ID.p8"

          IPA_PATH=$(find ios/App/output -name "*.ipa" | head -n 1)

          echo "Uploading $IPA_PATH to App Store Connect..."
          xcrun altool --upload-app \
            -t ios \
            -f "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
