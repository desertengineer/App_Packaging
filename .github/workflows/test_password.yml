name: Test Password
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check if password is non-empty
        run: |
          if [ -z "${{ secrets.APPLE_CERTIFICATE_PASS }}" ]; then
            echo "::error::Password secret is EMPTY!"
            exit 1
          else
            echo "Password secret exists and is non-empty"
          fi

      - name: Check password length
        run: |
          PASS="${{ secrets.APPLE_CERTIFICATE_PASS }}"
          echo "Password length: ${#PASS}"
