name: Test Password
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Print password length
        run: echo "Password length: ${{ length(secrets.APPLE_CERTIFICATE_PASS) }}"
      - name: Print first 8 chars
        run: echo "First 8 chars: ${{ secrets.APPLE_CERTIFICATE_PASS | slice(0, 8) }}"
