name: EnBlocks - iOS (AdMob)

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'Build notes / TestFlight release description (Optional)'
        required: false
        default: 'Manual trigger following commit completion'
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    environment: MagicBlockBlitz-Environment

    steps:

    # ============================================================
    # 1. CHECKOUT
    # ============================================================
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    # ============================================================
    # 2. DETERMINE PROJECT DIRECTORY
    # ============================================================
    - name: Determine Target Directory
      shell: bash
      run: |
        set -e
        RAW_DIR="${{ vars.MONOREPO_DIRECTORY }}"
        RAW_DIR="${RAW_DIR%/}"

        if [ -n "$RAW_DIR" ] && [ -d "$RAW_DIR" ]; then
          TARGET_DIR="$RAW_DIR"
        elif [ -d "EnBlocks" ]; then
          TARGET_DIR="EnBlocks"
        else
          TARGET_DIR="."
        fi

        echo "Target Working Directory: $TARGET_DIR"
        echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

    # ============================================================
    # 3. NODE.JS
    # ============================================================
    - name: Setup Node.js
      uses: actions/setup-node@v4.2.0
      with:
        node-version: 22

    # ============================================================
    # 4. PREPARE HTML5 WEB APPLICATION
    # ============================================================
    - name: Prepare Web Directory
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        mkdir -p dist

        echo "Preparing HTML5 application..."
        for file in \
          index.html \
          index.js \
          index.css
        do
          if [ -f "www/$file" ]; then
            cp "www/$file" "dist/$file"
            echo "Copied www/$file"
          elif [ -f "$file" ]; then
            cp "$file" "dist/$file"
            echo "Copied $file"
          else
            echo "Optional file not found: $file"
          fi
        done

        if [ -d "www/assets" ]; then
          cp -R www/assets dist/
          echo "Copied www/assets"
        elif [ -d "assets" ]; then
          cp -R assets dist/
          echo "Copied assets"
        fi

        echo ""
        echo "=== dist contents ==="
        find dist -maxdepth 3 -type f | sort

    # ============================================================
    # 5. INSTALL PROJECT DEPENDENCIES
    # ============================================================
    - name: Install Dependencies
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        if [ -f package-lock.json ]; then
          npm ci \
            --prefer-offline \
            --no-audit \
            --no-fund \
            --progress=false
        else
          npm install \
            --no-audit \
            --no-fund \
            --progress=false
        fi

    # ============================================================
    # 6. INSTALL COMPATIBLE CAPACITOR & ADMOB PACKAGES
    # ============================================================
    - name: Install Capacitor 6 & AdMob SDK
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        echo "Installing Capacitor 6 packages and AdMob Community Plugin..."
        npm install --save-exact \
          @capacitor/core@6 \
          @capacitor/cli@6 \
          @capacitor/ios@6

        npm install @capacitor-community/admob@6 || npm install @capacitor-community/admob

        echo ""
        echo "=== Capacitor CLI version ==="
        npx cap --version

        echo ""
        echo "=== Installed Packages ==="
        npm list --depth=0 || true

    # ============================================================
    # 7. CREATE CAPACITOR CONFIGURATION
    # ============================================================
    - name: Configure Capacitor
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        cat > capacitor.config.json <<EOF
        {
          "appId": "${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}",
          "appName": "${{ vars.APP_NAME || 'Magic Block Blitz 2026' }}",
          "webDir": "dist"
        }
        EOF

        echo "=== capacitor.config.json ==="
        cat capacitor.config.json

    # ============================================================
    # 8. CREATE / SYNC IOS PLATFORM
    # ============================================================
    - name: Add / Sync iOS Native Platform
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        echo "=== Capacitor Doctor ==="
        npx cap doctor || true

        echo "Pre-warming CocoaPods trunk..."
        pod repo add trunk https://cdn.cocoapods.org/ || true
        export COCOAPODS_DISABLE_STATS=true

        if [ ! -d "ios" ]; then
          echo "Creating iOS platform..."
          npx cap add ios || echo "⚠️ Capacitor pod install failed, step 12 will handle it."
        else
          echo "Synchronizing iOS platform..."
          npx cap sync ios || echo "⚠️ Capacitor pod install failed, step 12 will handle it."
        fi

        echo ""
        echo "=== iOS directory ==="
        ls -la ios

    # ============================================================
    # 8.5. UPDATE MINIMUM IOS DEPLOYMENT TARGET
    # ============================================================
    - name: Update Minimum iOS Version to 15.0
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        echo "Updating MinimumOSVersion to 15.0..."
        if [ -f "Podfile" ]; then
          sed -i '' "s/platform :ios, '[^']*'/platform :ios, '15.0'/g" Podfile
          echo "✅ Podfile minimum iOS version updated."
        fi

        if [ -f "App.xcodeproj/project.pbxproj" ]; then
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' App.xcodeproj/project.pbxproj
          echo "✅ project.pbxproj deployment target updated."
        fi

    # ============================================================
    # 8.6. CONFIGURE ADMOB & ATT IN INFO.PLIST
    # ============================================================
    - name: Inject AdMob Credentials & ATT into Info.plist
      working-directory: ${{ env.TARGET_DIR }}
      env:
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-2658659289706339~4005585343' }}
      shell: bash
      run: |
        set -e
        echo "Injecting unified ADMOB_APP_ID into Info.plist..."
        PLIST="ios/App/App/Info.plist"

        /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string '$ADMOB_APP_ID'" "$PLIST" || \
        /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier '$ADMOB_APP_ID'" "$PLIST"

        ATT_MSG="This identifier will be used to deliver personalized ads to you."
        /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string '$ATT_MSG'" "$PLIST" || \
        /usr/libexec/PlistBuddy -c "Set :NSUserTrackingUsageDescription '$ATT_MSG'" "$PLIST"

        /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" "$PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" "$PLIST" || true
        /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string 'cstr6suwng.skadnetwork'" "$PLIST" || true

        echo "✅ AdMob Info.plist configuration completed."

    # ============================================================
    # 9. GENERATE IOS APP ASSETS
    # ============================================================
    - name: Generate Native iOS App Icons
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        npm install @capacitor/assets --save-dev
        mkdir -p assets

        if [ -f "www/assets/icon.png" ]; then
          cp "www/assets/icon.png" "assets/icon.png"
        elif [ -f "www/icon.png" ]; then
          cp "www/icon.png" "assets/icon.png"
        fi

        npx @capacitor/assets generate --ios || echo "⚠️ Asset generation skipped/warning"

    # ============================================================
    # 10. IMPORT APPLE DISTRIBUTION CERTIFICATE
    # ============================================================
    - name: Import Apple Distribution Certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 || secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
        P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS || secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: "temp_keychain_pass_${{ github.run_id }}"
      shell: bash
      run: |
        set -e
        CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        security import "$CERTIFICATE_PATH" \
          -P "$P12_PASSWORD" \
          -A \
          -t cert \
          -f pkcs12 \
          -k "$KEYCHAIN_PATH"

        security list-keychains -d user -s "$KEYCHAIN_PATH"
        security default-keychain -s "$KEYCHAIN_PATH"

    # ============================================================
    # 11. INSTALL PROVISIONING PROFILE
    # ============================================================
    - name: Install Provisioning Profile
      env:
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE || secrets.APPLE_PROVISION_PROFILE || secrets.PROVISIONING_PROFILE_BASE64 }}
        FALLBACK_BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.magicblockblitz2026' }}
        FALLBACK_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID || vars.APPLE_TEAM_ID || 'XHNXQ72KYZ' }}
      shell: bash
      run: |
        set -e
        PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
        PLIST_PATH="$RUNNER_TEMP/profile.plist"

        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

        security cms -D -i "$PP_PATH" -o "$PLIST_PATH"

        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST_PATH")
        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PLIST_PATH")
        TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PLIST_PATH" || true)
        RAW_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST_PATH")

        BUNDLE_ID="${RAW_APP_ID#*.}"
        [ -z "$BUNDLE_ID" ] || [ "$BUNDLE_ID" = "*" ] && BUNDLE_ID="$FALLBACK_BUNDLE_ID"
        [ -z "$TEAM_ID" ] && TEAM_ID="$FALLBACK_TEAM_ID"

        echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
        echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
        echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
        echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$PROFILE_DIR"
        cp "$PP_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

    # ============================================================
    # 11.5. BUMP APP VERSION & BUILD NUMBER
    # ============================================================
    - name: Bump iOS Version and Build Number
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        echo "Bumping version numbers for App Store Connect..."
        PLIST="ios/App/App/Info.plist"

        if [ -f "package.json" ]; then
          APP_VERSION=$(node -p "require('./package.json').version")
        else
          APP_VERSION="1.0.2"
        fi

        if ! /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST"; then
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$PLIST"
        fi

        if ! /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"; then
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST"
        fi

        echo "Successfully updated Version to $APP_VERSION and Build Number to${{ github.run_number }}"

    # ============================================================ 
    # 12. CONFIGURE PODFILE & INSTALL COCOAPODS
    # ============================================================
    - name: Configure Podfile and Install CocoaPods
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        echo "Configuring Podfile to securely disable code signing for Pods and enforce iOS 15..."

        NEW_POST_INSTALL='post_install do |installer|
          installer.pods_project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
              config.build_settings["CODE_SIGN_IDENTITY"] = ""
              config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
              config.build_settings["ENABLE_USER_SCRIPT_SANDBOXING"] = "NO"
              config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.0"
            end
          end
        end'

        awk -v new_post_install="$NEW_POST_INSTALL" '
        BEGIN { in_post_install = 0; post_install_start = 0; post_install_end = 0; }
        /post_install do \|installer\|/ { in_post_install = 1; post_install_start = NR; next; }
        in_post_install && /^  end$/ { post_install_end = NR; in_post_install = 0; next; }
        in_post_install { next; }
        post_install_end > 0 {
          if (NR == post_install_start) {
            print new_post_install;
            next;
          }
        }
        { print; }
        END {
          if (post_install_start == 0) {
            print "";
            print new_post_install;
          }
        }' Podfile > Podfile.tmp && mv Podfile.tmp Podfile

        echo "Updated Podfile:"
        cat Podfile

        pod install --repo-update

    # ============================================================
    # 14. CREATE PRIVACY MANIFEST
    # ============================================================
    - name: Create Privacy Manifest
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        echo "Creating PrivacyInfo.xcprivacy with tracking enabled..."
        cat > App/PrivacyInfo.xcprivacy <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>NSPrivacyTracking</key>
            <true/>
            <key>NSPrivacyTrackingDomains</key>
            <array>
                <string>google.com</string>
                <string>doubleclick.net</string>
            </array>
            <key>NSPrivacyCollectedDataTypes</key>
            <array/>
            <key>NSPrivacyAccessedAPITypes</key>
            <array/>
        </dict>
        </plist>
        EOF

    # ============================================================
    # 16. VERIFY THAT PODS DO NOT HAVE PROVISIONING PROFILES
    # ============================================================
    - name: Verify Pods Configuration
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        if grep -q 'PROVISIONING_PROFILE_SPECIFIER = "[^"]' Pods/Pods.xcodeproj/project.pbxproj; then
          echo "ERROR: Pods project still contains a provisioning profile."
          exit 1
        fi

    # ============================================================
    # 18. SET BUILD NUMBER & EXPORT COMPLIANCE
    # ============================================================
    - name: Set Build Number & Export Compliance
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" App/Info.plist
        /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist || \
        /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Info.plist

    # ============================================================
    # 19. CONFIGURE TARGET SIGNING AND ARCHIVE IOS APP
    # ============================================================
    - name: Build and Archive iOS App
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      env:
        XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
      shell: bash
      run: |
        set -o pipefail
        
        echo "Injecting manual signing configuration strictly into the App target..."
        cat > configure_signing.rb <<'EOF'
        require 'xcodeproj'
        project_path = 'App.xcodeproj'
        project = Xcodeproj::Project.open(project_path)
        
        project.targets.each do |target|
          if target.name == 'App'
            target.build_configurations.each do |config|
              config.build_settings['DEVELOPMENT_TEAM'] = ENV['APPLE_TEAM_ID']
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_UUID']
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            end
          end
        end
        project.save
        EOF
        
        ruby configure_signing.rb
        echo "Successfully updated App.xcodeproj signing attributes."

        echo "Starting clean Xcode archive with optimizations..."
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme "$XCODE_SCHEME" \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath "$RUNNER_TEMP/App.xcarchive" \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          COMPILER_INDEX_STORE_ENABLE=NO \
          | tee "$RUNNER_TEMP/xcodebuild.log"

    # ============================================================
    # 20. VERIFY ARCHIVE
    # ============================================================
    - name: Verify Xcode Archive
      shell: bash
      run: |
        set -e
        if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
          echo "ERROR: Xcode archive was not created."
          exit 1
        fi

    # ============================================================
    # 21. CREATE EXPORT OPTIONS (INCLUDING dSYM UPLOAD)
    # ============================================================
    - name: Create Export Options
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        cat > exportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>teamID</key>
          <string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>signingCertificate</key>
          <string>Apple Distribution</string>
          <key>uploadSymbols</key>
          <true/>
          <key>uploadBitcode</key>
          <false/>
          <key>provisioningProfiles</key>
          <dict>
            <key>$BUNDLE_ID</key>
            <string>$PROFILE_UUID</string>
          </dict>
        </dict>
        </plist>
        EOF

    # ============================================================
    # 22. EXPORT IPA
    # ============================================================
    - name: Export IPA Package
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        mkdir -p ios/App/output
        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/App.xcarchive" \
          -exportOptionsPlist exportOptions.plist \
          -exportPath ios/App/output

    # ============================================================
    # 23. VERIFY IPA
    # ============================================================
    - name: Verify IPA Output
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        IPA_PATH=$(find ios/App/output -name "*.ipa" -print -quit)
        if [ -z "$IPA_PATH" ]; then
          echo "ERROR: No IPA file found."
          exit 1
        fi

    # ============================================================
    # 24. UPLOAD IPA AS GITHUB ARTIFACT
    # ============================================================
    - name: Upload Signed IPA to Workflow Artifacts
      uses: actions/upload-artifact@v4.6.1
      with:
        name: MagicBlockBlitz2026-iOS-Release
        path: ${{ env.TARGET_DIR }}/ios/App/output/*.ipa
        if-no-files-found: error

    # ============================================================
    # 25. UPLOAD TO APP STORE CONNECT / TESTFLIGHT
    # ============================================================
    - name: Upload to TestFlight / App Store Connect
      if: success()
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: ${{ env.TARGET_DIR }}/ios/App/output/App.ipa
        issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID || '2e4974f6-27d6-476e-9322-0a79cff7bf00' }}
        api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID || 'C6HLRTWSC2' }}
        api-private-key: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
