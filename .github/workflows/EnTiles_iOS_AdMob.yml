name: EnTiles - iOS (AdMob)

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Target Environment (e.g., TileMaster-Environment)"
        required: true
        type: string

      build_notes:
        description: "Build notes / TestFlight release description (Optional)"
        required: false
        default: "Manual trigger following commit completion"
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    environment: TileMaster-Environment

    steps:
    # ============================================================
    # 1. CHECKOUT
    # ============================================================
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    # ============================================================
    # 2. DETERMINE PROJECT DIRECTORY
    # ============================================================
    - name: Determine Target Directory
      shell: bash
      run: |
        set -e
        RAW_DIR="${{ vars.MONOREPO_DIRECTORY }}"
        RAW_DIR="${RAW_DIR%/}"

        if [ -n "$RAW_DIR" ] && [ -d "$RAW_DIR" ]; then
          TARGET_DIR="$RAW_DIR"
          echo "Detected Monorepo directory from vars."
        else
          TARGET_DIR="."
          echo "Using root directory."
        fi

        echo "Target Working Directory: $TARGET_DIR"
        echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

    # ============================================================
    # 3. NODE.JS
    # ============================================================
    - name: Setup Node.js
      uses: actions/setup-node@v4.2.0
      with:
        node-version: 22

    # ============================================================
    # 4. PREPARE HTML5 WEB APPLICATION
    # ============================================================
    - name: Prepare Web Directory
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        mkdir -p dist
        echo "Preparing HTML5 application..."

        if [ -f "index.html" ]; then
          SOURCE_DIR="."
        elif [ -f "www/index.html" ]; then
          SOURCE_DIR="www"
        else
          echo "ERROR: index.html not found in root or www/! Cannot proceed."
          exit 1
        fi

        if [ "$SOURCE_DIR" = "www" ]; then
          cp -R www/* dist/
        else
          find . -maxdepth 1 -type f -name "*.html" -exec cp {} dist/ \;
          find . -maxdepth 1 -type f -name "*.js" -exec cp {} dist/ \;
          find . -maxdepth 1 -type f -name "*.css" -exec cp {} dist/ \;
          find . -maxdepth 1 -type f -name "*.png" -exec cp {} dist/ \;
          find . -maxdepth 1 -type f -name "*.jpg" -exec cp {} dist/ \;
          find . -maxdepth 1 -type f -name "*.json" -exec cp {} dist/ \; -not -name "package*.json" -not -name "capacitor*.json"
          
          for folder in assets js css images img audio sounds fonts; do
            if [ -d "$folder" ]; then
              cp -R "$folder" dist/
            fi
          done
        fi

        if [ ! -f "dist/index.html" ]; then
          echo "ERROR: dist/index.html is missing. Capacitor will crash."
          exit 1
        fi
        echo "✅ index.html successfully staged in dist directory."

    # ============================================================
    # 5. INSTALL PROJECT DEPENDENCIES
    # ============================================================
    - name: Install Dependencies
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        if [ ! -f package.json ]; then
          echo "No package.json found. Initializing a new Node project..."
          npm init -y
        fi

        if [ -f package-lock.json ]; then
          npm ci --prefer-offline --no-audit --no-fund --progress=false
        else
          npm install --no-audit --no-fund --progress=false
        fi

    # ============================================================
    # 6. INSTALL CAPACITOR & ADMOB
    # ============================================================
    - name: Install Capacitor 6 & AdMob SDK
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        npm install --save-exact \
          @capacitor/core@6 \
          @capacitor/cli@6 \
          @capacitor/ios@6
          
        npm install @capacitor-community/admob
        npx cap --version

    # ============================================================
    # 7. CONFIGURE AND SYNC CAPACITOR
    # ============================================================
    - name: Configure and Sync iOS Platform
      working-directory: ${{ env.TARGET_DIR }}
      env:
        RAW_BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER }}
        RAW_APP_NAME: ${{ vars.APP_NAME }}
      shell: bash
      run: |
        set -e
        if [ -z "$RAW_BUNDLE_ID" ] || [ -z "$RAW_APP_NAME" ]; then
          echo "ERROR: BUNDLE_IDENTIFIER or APP_NAME variable is missing in the environment."
          exit 1
        fi

        CLEAN_BUNDLE_ID=$(echo "$RAW_BUNDLE_ID" | tr -d '\r\n')
        CLEAN_APP_NAME=$(echo "$RAW_APP_NAME" | tr -d '\r\n')

        cat > capacitor.config.json <<EOF
        {
          "appId": "$CLEAN_BUNDLE_ID",
          "appName": "$CLEAN_APP_NAME",
          "webDir": "dist"
        }
        EOF

        export COCOAPODS_DISABLE_STATS=true

        if [ ! -d "ios" ]; then
          npx cap add ios || echo "⚠️ Initial pod install failed (expected due to AdMob iOS 14+). Proceeding to patch..."
        else
          npx cap sync ios || echo "⚠️ Sync pod install failed. Proceeding to patch..."
        fi

    # ============================================================
    # 8. UPDATE MINIMUM IOS DEPLOYMENT TARGET
    # ============================================================
    - name: Update Minimum iOS Version to 15.0
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        if [ -f "Podfile" ]; then
          sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/g" Podfile
        fi
        if [ -f "App.xcodeproj/project.pbxproj" ]; then
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" App.xcodeproj/project.pbxproj
        fi

    # ============================================================
    # 9. CONFIGURE ADMOB & ATT IN INFO.PLIST
    # ============================================================
    - name: Inject AdMob Credentials & ATT into Info.plist
      working-directory: ${{ env.TARGET_DIR }}
      env:
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      shell: bash
      run: |
        set -e
        PLIST="ios/App/App/Info.plist"
        if [ -n "$ADMOB_APP_ID" ]; then
          CLEAN_ADMOB_ID=$(echo "$ADMOB_APP_ID" | tr -d '\r\n')
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string '$CLEAN_ADMOB_ID'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier '$CLEAN_ADMOB_ID'" "$PLIST"
        fi

        ATT_MSG="This identifier will be used to deliver personalized ads to you."
        /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string '$ATT_MSG'" "$PLIST" || \
        /usr/libexec/PlistBuddy -c "Set :NSUserTrackingUsageDescription '$ATT_MSG'" "$PLIST"

    # ============================================================
    # 10. GENERATE IOS APP ASSETS
    # ============================================================
    - name: Generate Native iOS App Icons
      working-directory: ${{ env.TARGET_DIR }}
      run: |
        set -e

        npm install @capacitor/assets --save-dev
        mkdir -p assets

        if [ -f "www/assets/icon.png" ]; then
          cp "www/assets/icon.png" "assets/icon.png"
        elif [ -f "www/icon.png" ]; then
          cp "www/icon.png" "assets/icon.png"
        fi

        npx @capacitor/assets generate --ios

    # ============================================================
    # 11. IMPORT APPLE DISTRIBUTION CERTIFICATE
    # ============================================================
    - name: Import Apple Distribution Certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
        KEYCHAIN_PASSWORD: "temp_keychain_pass_${{ github.run_id }}"
      shell: bash
      run: |
        set -e
        if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
          echo "ERROR: Apple distribution certificate secret is empty."
          exit 1
        fi

        CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH"
        security default-keychain -s "$KEYCHAIN_PATH"

    # ============================================================
    # 12. INSTALL PROVISIONING PROFILE
    # ============================================================
    - name: Install Provisioning Profile
      env:
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE }}
        ENV_BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER }}
        ENV_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
      shell: bash
      run: |
        set -e
        if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
          echo "ERROR: Provisioning profile secret is empty."
          exit 1
        fi

        PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
        PLIST_PATH="$RUNNER_TEMP/profile.plist"

        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
        security cms -D -i "$PP_PATH" -o "$PLIST_PATH"

        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST_PATH")
        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PLIST_PATH")
        TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PLIST_PATH" || true)
        RAW_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST_PATH")

        BUNDLE_ID="${RAW_APP_ID#*.}"
        if [ -z "$BUNDLE_ID" ] || [ "$BUNDLE_ID" = "*" ]; then
          BUNDLE_ID=$(echo "$ENV_BUNDLE_ID" | tr -d '\r\n')
        fi

        if [ -z "$TEAM_ID" ]; then
          TEAM_ID=$(echo "$ENV_TEAM_ID" | tr -d '\r\n')
        fi

        echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
        echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
        echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
        echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$PROFILE_DIR"
        cp "$PP_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

    # ============================================================
    # 13. BUMP APP VERSION & BUILD NUMBER
    # ============================================================
    - name: Bump iOS Version and Build Number
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        PLIST="ios/App/App/Info.plist"
        
        # Add an offset of 20 to ensure the build number surpasses 12
        NEW_BUILD_NUMBER=$(date +%s)
        
        if ! /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST"; then
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString 1.0.0" "$PLIST"
        fi
        if ! /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" "$PLIST"; then
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion $NEW_BUILD_NUMBER" "$PLIST"
        fi

    # ============================================================
    # 14. INSTALL COCOAPODS
    # ============================================================
    - name: Install CocoaPods Dependencies
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        pod install --repo-update

    # ============================================================
    # 15. DISABLE SIGNING FOR COCOAPODS
    # ============================================================
    - name: Configure CocoaPods Signing
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        PODS_PROJECT="Pods/Pods.xcodeproj/project.pbxproj"
        python3 - "$PODS_PROJECT" <<'PY'
        import sys
        import re
        path = sys.argv[1]
        with open(path, "r", encoding="utf-8") as f:
          data = f.read()
        data = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;];', '', data)
        data = re.sub(r'PROVISIONING_PROFILE = [^;];', '', data)
        data = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', '', data)
        data = re.sub(r'CODE_SIGNING_ALLOWED = YES;', 'CODE_SIGNING_ALLOWED = NO;', data)
        data = re.sub(r'CODE_SIGNING_REQUIRED = YES;', 'CODE_SIGNING_REQUIRED = NO;', data)
        with open(path, "w", encoding="utf-8") as f:
          f.write(data)
        PY

    # ============================================================
    # 16. CREATE PRIVACY MANIFEST
    # ============================================================
    - name: Create Privacy Manifest
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        if [ ! -f "App/PrivacyInfo.xcprivacy" ]; then
          cat > App/PrivacyInfo.xcprivacy <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict/>
        </plist>
        EOF
        fi

    # ============================================================
    # 17. CONFIGURE SIGNING FOR THE APP PROJECT
    # ============================================================
    - name: Configure App Target Signing
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      env:
        APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        PROFILE_UUID: ${{ env.PROFILE_UUID }}
        PROFILE_NAME: ${{ env.PROFILE_NAME }}
      run: |
        set -e
        PBXPROJ="App.xcodeproj/project.pbxproj"
        python3 - "$PBXPROJ" "$APPLE_TEAM_ID" "$PROFILE_UUID" "$PROFILE_NAME" <<'PY'
        import sys
        import re

        path = sys.argv[1]
        team = sys.argv[2]
        profile_uuid = sys.argv[3]
        profile_name = sys.argv[4]

        with open(path, "r", encoding="utf-8") as f:
          data = f.read()

        data = re.sub(r'ProvisioningStyle\s*=\s*[A-Za-z]+;', 'ProvisioningStyle = Manual;', data)
        data = re.sub(r'CODE_SIGN_STYLE\s*=\s*[^;]+;', 'CODE_SIGN_STYLE = Manual;', data)
        data = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]+;', f'DEVELOPMENT_TEAM = {team};', data)
        data = re.sub(r'CODE_SIGN_IDENTITY\s*=\s*[^;]+;', 'CODE_SIGN_IDENTITY = "Apple Distribution";', data)
        data = re.sub(r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;', f'PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";', data)
        data = re.sub(r'PROVISIONING_PROFILE\s*=\s*[^;]*;', f'PROVISIONING_PROFILE = "{profile_uuid}";', data)

        def inject_settings(match):
          block = match.group(0)
          if 'CODE_SIGN_STYLE' not in block:
            block = block.replace('buildSettings = {', 'buildSettings = {\n\t\t\t\tCODE_SIGN_STYLE = Manual;')
          if 'DEVELOPMENT_TEAM' not in block:
            block = block.replace('buildSettings = {', f'buildSettings = {{\n\t\t\t\tDEVELOPMENT_TEAM = {team};')
          if 'CODE_SIGN_IDENTITY' not in block:
            block = block.replace('buildSettings = {', 'buildSettings = {\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";')
          if 'PROVISIONING_PROFILE_SPECIFIER' not in block:
            block = block.replace('buildSettings = {', f'buildSettings = {{\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";')
          if 'PROVISIONING_PROFILE =' not in block and 'PROVISIONING_PROFILE=' not in block:
            block = block.replace('buildSettings = {', f'buildSettings = {{\n\t\t\t\tPROVISIONING_PROFILE = "{profile_uuid}";')
          return block

        data = re.sub(r'buildSettings\s*=\s*{[\s\S]*?};', inject_settings, data)
        with open(path, "w", encoding="utf-8") as f:
          f.write(data)
        PY

    # ============================================================
    # 18. VERIFY POD SIGNING CONFIGURATION
    # ============================================================
    - name: Verify Signing Configuration
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        if grep -n 'PROVISIONING_PROFILE_SPECIFIER' Pods/Pods.xcodeproj/project.pbxproj; then
          echo "ERROR: Pods project still contains a provisioning profile."
          exit 1
        fi

    # ============================================================
    # 19. SHOW XCODE BUILD SETTINGS
    # ============================================================
    - name: Verify Xcode Build Settings
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      env:
        RAW_XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
      shell: bash
      run: |
        set -e
        CLEAN_SCHEME=$(echo "$RAW_XCODE_SCHEME" | tr -d '\r\n')
        xcodebuild -workspace App.xcworkspace -scheme "$CLEAN_SCHEME" -configuration Release -showBuildSettings > "$RUNNER_TEMP/build-settings.txt"

    # ============================================================
    # 20. SET EXPORT COMPLIANCE
    # ============================================================
    - name: Set Export Compliance
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      shell: bash
      run: |
        set -e
        /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist || \
        /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Info.plist

    # ============================================================
    # 21. BUILD AND ARCHIVE
    # ============================================================
    - name: Build and Archive iOS App
      working-directory: ${{ env.TARGET_DIR }}/ios/App
      env:
        RAW_XCODE_SCHEME: ${{ vars.XCODE_SCHEME || 'App' }}
      shell: bash
      run: |
        set -o pipefail
        CLEAN_SCHEME=$(echo "$RAW_XCODE_SCHEME" | tr -d '\r\n')
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme "$CLEAN_SCHEME" \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath "$RUNNER_TEMP/App.xcarchive" \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          | tee "$RUNNER_TEMP/xcodebuild.log"

    # ============================================================
    # 22. VERIFY ARCHIVE
    # ============================================================
    - name: Verify Xcode Archive
      shell: bash
      run: |
        set -e
        ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
        if [ ! -d "$ARCHIVE_PATH" ]; then
          echo "ERROR: Xcode archive was not created."
          exit 1
        fi

    # ============================================================
    # 23. CREATE EXPORT OPTIONS
    # ============================================================
    - name: Create Export Options
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        cat > exportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>teamID</key>
          <string>${APPLE_TEAM_ID}</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>signingCertificate</key>
          <string>Apple Distribution</string>
          <key>provisioningProfiles</key>
          <dict>
            <key>${BUNDLE_ID}</key>
            <string>${PROFILE_UUID}</string>
          </dict>
        </dict>
        </plist>
        EOF

    # ============================================================
    # 24. EXPORT IPA
    # ============================================================
    - name: Export IPA Package
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        mkdir -p ios/App/output
        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/App.xcarchive" \
          -exportOptionsPlist exportOptions.plist \
          -exportPath ios/App/output

    # ============================================================
    # 25. VERIFY IPA OUTPUT
    # ============================================================
    - name: Verify IPA Output
      working-directory: ${{ env.TARGET_DIR }}
      shell: bash
      run: |
        set -e
        IPA_PATH=$(find ios/App/output -name "*.ipa" -print -quit)
        if [ -z "$IPA_PATH" ]; then
          echo "ERROR: No IPA file found."
          exit 1
        fi

    # ============================================================
    # 26. UPLOAD IPA AS GITHUB ARTIFACT
    # ============================================================
    - name: Upload Signed IPA to Workflow Artifacts
      uses: actions/upload-artifact@v4.6.1
      with:
        name: App-iOS-Release
        path: ${{ env.TARGET_DIR }}/ios/App/output/*.ipa
        if-no-files-found: error

    # ============================================================
    # 27. UPLOAD TO APP STORE CONNECT
    # ============================================================
    - name: Upload to TestFlight / App Store Connect
      if: success()
      working-directory: ${{ env.TARGET_DIR }}
      env:
        KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        BUILD_NOTES: ${{ inputs.build_notes }}
      shell: bash
      run: |
        set -e
        if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_CONTENT" ]; then
          echo "Skipping App Store Connect upload (credentials not provided)."
          exit 0
        fi

        API_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$API_KEYS_DIR"
        KEY_FILE="$API_KEYS_DIR/AuthKey_${KEY_ID}.p8"

        CLEAN_KEY=$(printf '%s' "$KEY_CONTENT" | tr -d '\r')
        if echo "$CLEAN_KEY" | grep -q "BEGIN PRIVATE KEY"; then
          printf '%s\n' "$CLEAN_KEY" > "$KEY_FILE"
        else
          printf '%s' "$CLEAN_KEY" | base64 --decode > "$KEY_FILE" 2>/dev/null || printf '%s\n' "$CLEAN_KEY" > "$KEY_FILE"
        fi
        chmod 600 "$KEY_FILE"

        IPA_PATH=$(find ios/App/output -name "*.ipa" -print -quit)

        xcrun altool \
          --upload-app \
          -t ios \
          -f "$IPA_PATH" \
          --apiKey "$KEY_ID" \
          --apiIssuer "$ISSUER_ID"