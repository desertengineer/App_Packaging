name: EnTiles - iOS App Store (AdMob)

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: "Build notes / TestFlight release description"
        required: false
        default: "Manual TestFlight build"
        type: string

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build and upload iOS app
    runs-on: macos-15
    environment: TileMaster-Environment # <--- Configure per app environment or secrets
    timeout-minutes: 60

    env:
      NODE_VERSION: "24"
      IOS_DEPLOYMENT_TARGET: "15.0"
      
      # ==========================================
      # CHANGE THESE VALUES FOR EACH NEW APP
      # ==========================================
      APP_VERSION: "1.0.1"
      BUNDLE_ID: "com.bekeiratapps.classic2048tile"
      APP_NAME: "Tile 2048 Master"
      XCODE_SCHEME: "App"
      MONOREPO_SUBFOLDER: "EnTiles2048" # Set to "." if the app is at repo root
      # ==========================================

      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      
      # App-Specific AdMob Secrets (leave blank or remove if not using AdMob)
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_APP_OPEN_AD_ID: ${{ secrets.ADMOB_APP_OPEN_AD_ID }}
      ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      ADMOB_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
      ADMOB_NATIVE_ADVANCED_AD_ID: ${{ secrets.ADMOB_NATIVE_ADVANCED_AD_ID }}
      ADMOB_REWARDED_AD_ID: ${{ secrets.ADMOB_REWARDED_AD_ID }}
      ADMOB_REWARDED_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_REWARDED_INTERSTITIAL_AD_ID }}

      CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
      KEYCHAIN_PASSWORD: temporary-${{ github.run_id }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      XCODE_MAJOR_REQUIRED: "26"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode 26 for App Store compliance
        shell: bash
        run: |
          set -Eeuo pipefail

          candidates=(
            "/Applications/Xcode_26.0.app/Contents/Developer"
            "/Applications/Xcode_26.app/Contents/Developer"
            "/Applications/Xcode.app/Contents/Developer"
          )

          selected=""
          for candidate in "${candidates[@]}"; do
            if [[ -d "$candidate" ]]; then
              sdk_path="$candidate/Platforms/iPhoneOS.platform/Developer/SDKs"
              if ls "$sdk_path" | grep -q "iPhoneOS26"; then
                selected="$candidate"
                break
              elif [[ -z "$selected" ]]; then
                selected="$candidate"
              fi
            fi
          done

          if [[ -z "$selected" ]]; then
            echo "::error::Xcode 26 or later was not found on the runner."
            exit 1
          fi

          sudo xcode-select -switch "$selected"
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"

          echo "=== Xcode & SDK Information ==="
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify Xcode SDK version
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_version="$(xcrun --show-sdk-version)"
          major_version="${sdk_version%%.*}"

          echo "Detected SDK version: $sdk_version"
          if (( major_version < XCODE_MAJOR_REQUIRED )); then
            echo "::error::App Store Connect requires iOS SDK 26 or newer. Detected: $sdk_version"
            exit 1
          fi

      - name: Locate app project directory
        shell: bash
        run: |
          set -Eeuo pipefail

          configured_dir="${{ env.MONOREPO_SUBFOLDER }}"
          configured_dir="${configured_dir%/}"

          if [[ "$configured_dir" == "." || -z "$configured_dir" ]]; then
            target_dir="."
          elif [[ -f "$configured_dir/package.json" ]]; then
            target_dir="$configured_dir"
          else
            echo "::error::Could not locate project directory: $configured_dir"
            exit 1
          fi

          target_dir="$(cd "$target_dir" && pwd)"
          echo "TARGET_DIR=$target_dir" >> "$GITHUB_ENV"

      - name: Validate configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${BUNDLE_ID:?Missing BUNDLE_ID}"
          : "${XCODE_SCHEME:?Missing XCODE_SCHEME}"

      - name: Validate project structure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$TARGET_DIR"

          required_paths=(
            "package.json"
            "package-lock.json"
            "capacitor.config.json"
            "www/index.html"
            "ios/App/App.xcworkspace"
            "ios/App/App.xcodeproj"
            "ios/App/Podfile"
            "ios/App/App/Info.plist"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Missing required path: $TARGET_DIR/$path"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TARGET_DIR }}/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund --progress=false

      - name: Configure Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("capacitor.config.json")
          with path.open("r", encoding="utf-8") as file:
              config = json.load(file)

          config["appId"] = os.environ["BUNDLE_ID"]
          config["appName"] = os.environ["APP_NAME"]
          config["webDir"] = "www"

          if os.environ.get("ADMOB_APP_ID"):
              plugins = config.setdefault("plugins", {})
              admob = plugins.setdefault("AdMob", {})
              admob["appId"] = os.environ["ADMOB_APP_ID"]

          with path.open("w", encoding="utf-8") as file:
              json.dump(config, file, indent=2)
              file.write("\n")
          PY

      - name: Generate AdMob runtime configuration (optional)
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${ADMOB_APP_ID:-}" ]]; then
            python3 -c '
            import json, os
            from pathlib import Path
            config = {
                "appId": os.environ.get("ADMOB_APP_ID", ""),
                "appOpen": os.environ.get("ADMOB_APP_OPEN_AD_ID", ""),
                "banner": os.environ.get("ADMOB_BANNER_AD_ID", ""),
                "interstitial": os.environ.get("ADMOB_INTERSTITIAL_AD_ID", ""),
                "nativeAdvanced": os.environ.get("ADMOB_NATIVE_ADVANCED_AD_ID", ""),
                "rewarded": os.environ.get("ADMOB_REWARD_AD_ID", ""),
                "rewardedInterstitial": os.environ.get("ADMOB_REWARDED_INTERSTITIAL_AD_ID", "")
            }
            content = "/* Generated by GitHub Actions. Do not edit manually. */\nwindow.__ADMOB_CONFIG__ = Object.freeze(" + json.dumps(config, indent=4) + ");\n"
            Path("www/admob-config.js").write_text(content, encoding="utf-8")
            '
            test -s www/admob-config.js || true
          fi

      - name: Sync Capacitor iOS
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          set -Eeuo pipefail
          npx cap sync ios

      - name: Generate Capacitor Assets (App Icon)
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "assets/icon.png" ]]; then
            npm install -D @capacitor/assets || true
            npx @capacitor/assets generate --ios
          fi

      - name: Configure Info.plist
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          plist="ios/App/App/Info.plist"

          set_value() {
            local key="$1"
            local type="$2"
            local value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :$key $type $value" "$plist"
          }

          if [[ -n "${ADMOB_APP_ID:-}" ]]; then
            set_value GADApplicationIdentifier string "$ADMOB_APP_ID"
            set_value NSUserTrackingUsageDescription string "This identifier will be used to deliver personalized ads to you."
          fi
          set_value UIRequiresFullScreen bool true
          set_value ITSAppUsesNonExemptEncryption bool false

      - name: Install xcodeproj Ruby gem & Disable Pods Signing
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail
          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
          project.targets.each do |target|
            target.build_configurations.each do |configuration|
              settings = configuration.build_settings
              settings['CODE_SIGNING_ALLOWED'] = 'NO'
              settings['CODE_SIGNING_REQUIRED'] = 'NO'
              settings['CODE_SIGN_IDENTITY'] = '-'
              settings['DEVELOPMENT_TEAM'] = ''
            end
          end
          project.save
          RUBY

      - name: Import Apple distribution certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          certificate_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Install App Store provisioning profile
        shell: bash
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.BASE64_PROVISIONING_PROFILE }}
        run: |
          set -Eeuo pipefail
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"

          mkdir -p "$profile_dir"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c "Print :UUID" "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$profile_plist")"

          if [[ "$profile_app_id" != *"$BUNDLE_ID" ]]; then
            echo "::error::Provisioning profile does not match Bundle ID $BUNDLE_ID"
            exit 1
          fi

          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

      - name: Configure native App target signing
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        env:
          APP_PROFILE_UUID: ${{ env.PROFILE_UUID }}
          APP_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          set -Eeuo pipefail
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('App.xcodeproj')
          target = project.targets.find { |item| item.name == 'App' }
          abort 'Native App target was not found.' unless target

          target.build_configurations.each do |configuration|
            settings = configuration.build_settings
            settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('APP_BUNDLE_ID')
            settings['DEVELOPMENT_TEAM'] = ENV.fetch('APP_TEAM_ID')
            settings['CODE_SIGN_STYLE'] = 'Manual'
            settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('APP_PROFILE_UUID')
            settings['CODE_SIGNING_ALLOWED'] = 'YES'
            settings['CODE_SIGNING_REQUIRED'] = 'YES'
          end
          project.save
          RUBY

      - name: Set iOS version and build number
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail
          plist="App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$plist"

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          set -Eeuo pipefail
          rm -rf Pods/ || true
          rm -f Podfile.lock || true
          pod install

      - name: Archive iOS app with SDK 26
        working-directory: ${{ env.TARGET_DIR }}/ios/App
        shell: bash
        run: |
          set -Eeuo pipefail
          archive_path="$RUNNER_TEMP/App.xcarchive"
          
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            SDKROOT=iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create export options & Export IPA
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import os, plistlib
          from pathlib import Path
          options = {
              "method": "app-store-connect",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "destination": "export",
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_UUID"]
              }
          }
          with Path("exportOptions.plist").open("wb") as file:
              plistlib.dump(options, file)
          PY

          output_path="$TARGET_DIR/ios/App/output"
          rm -rf "$output_path"
          mkdir -p "$output_path"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$output_path"

          ipa_path="$(find "$output_path" -maxdepth 1 -name "*.ipa" -print -quit)"
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -Eeuo pipefail
          api_key_dir="$HOME/.appstoreconnect/private_keys"
          key_file="$api_key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$api_key_dir"

          if [[ "$ASC_KEY_CONTENT" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY_CONTENT" > "$key_file"
          else
            echo "$ASC_KEY_CONTENT" | base64 --decode > "$key_file"
          fi
          chmod 600 "$key_file"

          xcrun altool --upload-app -t ios -f "$IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi