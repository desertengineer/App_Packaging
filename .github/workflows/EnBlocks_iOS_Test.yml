name: EnBlocks - iOS Test Build (Minimal)

on:
  workflow_dispatch:
    inputs:
      test_only:
        description: "Test workflow only"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test workflow
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test Xcode
        run: |
          xcodebuild -version
          echo "Xcode is available"

      - name: Test Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test npm install
        working-directory: EnBlocks
        run: |
          npm ci --no-audit --no-fund --progress=false
          echo "npm install successful"

      - name: Test Capacitor sync
        working-directory: EnBlocks
        run: |
          npx cap sync ios
          echo "Capacitor sync successful"

      - name: Verify frameworks exist
        working-directory: EnBlocks/ios/App
        run: |
          test -d GoogleMobileAds.xcframework && echo "GoogleMobileAds.xcframework exists" || exit 1
          test -d UserMessagingPlatform.xcframework && echo "UserMessagingPlatform.xcframework exists" || exit 1
          echo "Both frameworks verified"
