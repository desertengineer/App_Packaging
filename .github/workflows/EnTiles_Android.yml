name: Build EnTiles - Android (AdMob)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment: TileMaster-Environment

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup Node.js & Java
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Prepare Web Directory & Install Dependencies
      run: |
        mkdir -p EnTiles2048/dist
        cp -R EnTiles2048/www/* EnTiles2048/dist/
        cd EnTiles2048
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob --no-fund --no-audit

    - name: Configure Capacitor & Add Android
      working-directory: EnTiles2048
      run: |
        cat > capacitor.config.json <<EOF
        {
          "appId": "${{ vars.BUNDLE_IDENTIFIER || 'com.bekeiratapps.classic2048tile' }}",
          "appName": "${{ vars.APP_NAME || 'Tile 2048 Master' }}",
          "webDir": "dist"
        }
        EOF
        npx cap add android

    - name: Inject AdMob App ID into AndroidManifest
      working-directory: EnTiles2048/android/app/src/main
      env:
        ADMOB_APP_ID: ${{ secrets.ENTILES_ADMOB_APP_ID || 'ca-app-pub-2658659289706339~2395778751' }}
      run: |
        sed -i "/<\/application>/i \        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>" AndroidManifest.xml

    - name: Generate Assets
      working-directory: EnTiles2048
      run: |
        npm install @capacitor/assets --save-dev
        mkdir -p assets
        cp www/assets/icon.png assets/icon.png
        npx @capacitor/assets generate --android

    - name: Build Android App
      working-directory: EnTiles2048/android
      run: ./gradlew bundleRelease assembleRelease

    - name: Sign Android Release
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: EnTiles2048/android/app/build/outputs/bundle/release
        signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        alias: ${{ secrets.ANDROID_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EnTiles-Android-1.0.0
        path: |
          EnTiles2048/android/app/build/outputs/bundle/release/*.aab
          EnTiles2048/android/app/build/outputs/apk/release/*.apk